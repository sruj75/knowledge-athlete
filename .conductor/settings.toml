"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"
# Provider credentials and release exports are never copied into new workspaces.
file_include_globs = "!**"

[prompts]
create_pr = """
Follow PR closeout, Wiki maintenance and Engineering rules in openwiki/INSTRUCTIONS.md.
On the current branch, inspect all intended changes, finish source/tests and the native
OpenWiki update. Update the tracked Mermaid product map when relevant flows change.
Commit intended source, tests and documentation, run the required PR preflights, then
push and create or update the PR against the configured target branch using the
repository PR template. Integrate newer main and revalidate before merge. Stop and
report failures. Do not merge the PR or archive the workspace as part of Create PR.
For instruction or workflow changes, fill in the template's Policy changes section
from the original user decision. Review scope and preserved qualifications; copied
upstream rules or prior agent plans do not establish the user's intent.
"""

[scripts]
setup = "bash scripts/dev-harness/conductor-dev.sh setup"
archive = "bash scripts/dev-harness/conductor-dev.sh archive"
run_mode = "concurrent"

[scripts.run.dev]
command = "bash scripts/dev-harness/conductor-dev.sh start"
available_in = ["local"]
default = true
icon = "play"

[scripts.run.dev-status]
command = "bash scripts/dev-harness/conductor-dev.sh status"
available_in = ["local"]
icon = "activity"
