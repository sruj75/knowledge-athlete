name: Qualify Desktop Beta Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Newest v*-macos candidate tag whose owner evidence should be admitted'
        required: true
        type: string
      owner_evidence_asset:
        description: 'Exact content-addressed owner-manual-qualification-*.zip release asset'
        required: true
        type: string

run-name: Qualify desktop beta ${{ inputs.release_tag }}
permissions:
  contents: read
concurrency:
  group: desktop-beta-qualification-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  qualify-owner-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beta
    permissions:
      contents: read
    outputs:
      qualified: ${{ steps.publish.outputs.qualified }}
    steps:
      - name: Require exact repository owner dispatch
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$ACTOR" = sruj75
          test "$ACTOR_ID" = 120443863
          test "$REPOSITORY_OWNER" = sruj75
          test "$REPOSITORY_OWNER_ID" = 120443863
          test "$TRIGGERING_ACTOR" = sruj75

      - name: Checkout exact candidate tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Bind tag and checkout to the same immutable commit
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?\+[1-9][0-9]*-macos$ ]]
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          target_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          test "$target_sha" = "$(git rev-parse 'HEAD^{commit}')"
          test -z "$(git status --porcelain)"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Fetch exact release bytes and owner evidence
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_EVIDENCE_ASSET: ${{ inputs.owner_evidence_asset }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          STAGE: ${{ runner.temp }}/desktop-owner-qualification
        run: |
          set -euo pipefail
          [[ "$OWNER_EVIDENCE_ASSET" =~ ^owner-manual-qualification-[0-9a-f]{40}-[0-9a-f]{64}\.zip$ ]]
          (umask 077; mkdir "$STAGE" "$STAGE/assets")
          gh api "repos/$REPO/releases/tags/$RELEASE_TAG" > "$STAGE/release-rest.json"
          jq '{
            id,
            tagName: .tag_name,
            body,
            isDraft: .draft,
            isPrerelease: .prerelease,
            publishedAt: .published_at,
            assets: [.assets[] | {
              id, name, created_at, digest,
              url: .browser_download_url,
              uploader: {login: .uploader.login, id: .uploader.id}
            }]
          }' "$STAGE/release-rest.json" > "$STAGE/release.json"
          test "$(jq --arg name "$OWNER_EVIDENCE_ASSET" '[.assets[] | select(.name == $name)] | length' "$STAGE/release.json")" = 1
          for name in Intentive.zip intentive.dmg Intentive.Beta.zip intentive-beta.dmg \
            desktop-smoke-result.json desktop-smoke-result-beta.json "$OWNER_EVIDENCE_ASSET"; do
            test "$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$STAGE/release.json")" = 1
            gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "$name" --dir "$STAGE"
          done
          mv "$STAGE/Intentive.zip" "$STAGE/intentive.dmg" \
            "$STAGE/Intentive.Beta.zip" "$STAGE/intentive-beta.dmg" "$STAGE/assets/"

      - name: Validate exact signed candidate and owner evidence
        env:
          OWNER_EVIDENCE_ASSET: ${{ inputs.owner_evidence_asset }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          STAGE: ${{ runner.temp }}/desktop-owner-qualification
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
          EXPECTED_TEAM_ID: 24D6NXS6H7
        run: |
          set -euo pipefail
          latest_tag=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:strip=2)' 'refs/tags/v*-macos')
          python3 .github/scripts/check-desktop-auto-beta-candidate.py \
            --qualification-mode owner-manual \
            --release-json "$STAGE/release.json" \
            --smoke-result "$STAGE/desktop-smoke-result.json" \
            --beta-smoke-result "$STAGE/desktop-smoke-result-beta.json" \
            --release-tag "$RELEASE_TAG" --latest-tag "$latest_tag" \
            --tag-sha "$TARGET_SHA" --checkout-sha "$TARGET_SHA" \
            --expected-team-id "$EXPECTED_TEAM_ID" \
            --output "$STAGE/candidate-gate.json"
          digest_args=()
          for name in Intentive.zip intentive.dmg Intentive.Beta.zip intentive-beta.dmg; do
            digest_args+=(--artifact-digest "$name=$(sha256sum "$STAGE/assets/$name" | awk '{print $1}')")
          done
          python3 .github/scripts/owner_manual_desktop_qualification.py verify \
            --release-tag "$RELEASE_TAG" --source-sha "$TARGET_SHA" \
            --bundle "$STAGE/$OWNER_EVIDENCE_ASSET" "${digest_args[@]}"

      - name: Verify live canonical backend chat compatibility
        env:
          INTENTIVE_PRODUCTION_API_URL: ${{ vars.INTENTIVE_PRODUCTION_API_URL }}
          STAGE: ${{ runner.temp }}/desktop-owner-qualification
        run: |
          set -euo pipefail
          [[ "$INTENTIVE_PRODUCTION_API_URL" == https://* ]]
          [[ "$INTENTIVE_PRODUCTION_API_URL" != *omi.me* && "$INTENTIVE_PRODUCTION_API_URL" != *basedhardware* ]]
          curl -fsS --max-time 15 "${INTENTIVE_PRODUCTION_API_URL%/}/v1/health" > "$STAGE/backend-health.json"
          curl -fsS --max-time 15 "${INTENTIVE_PRODUCTION_API_URL%/}/" > "$STAGE/backend-root.json"
          python3 .github/scripts/owner_manual_desktop_qualification.py verify-backend-compatibility \
            --backend-contract-source backend/routers/desktop_core.py \
            --process-health "$STAGE/backend-health.json" --root-health "$STAGE/backend-root.json" \
            --output "$STAGE/backend-compatibility.json"

      - name: Bind owner-uploaded evidence identity
        env:
          OWNER_EVIDENCE_ASSET: ${{ inputs.owner_evidence_asset }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          STAGE: ${{ runner.temp }}/desktop-owner-qualification
        run: |
          set -euo pipefail
          jq --arg name "$OWNER_EVIDENCE_ASSET" '
            .id as $release_id |
            [.assets[] | select(.name == $name)] |
            if length != 1 then error("owner evidence asset is missing or ambiguous") else .[0] end |
            {
              schema_version: 1,
              asset_name: .name,
              asset_id: .id,
              asset_url: .url,
              sha256: (.digest | sub("^sha256:"; "")),
              uploader_login: .uploader.login,
              uploader_id: .uploader.id,
              release_id: $release_id,
              created_at: .created_at
            }
          ' "$STAGE/release.json" > "$STAGE/owner-manual.json"

      - name: Create immutable qualification evidence
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          STAGE: ${{ runner.temp }}/desktop-owner-qualification
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/desktop_qualification_evidence.py build \
            --qualification-mode owner-manual \
            --owner-manual-json "$STAGE/owner-manual.json" \
            --release-json "$STAGE/release.json" --release-tag "$RELEASE_TAG" \
            --source-sha "$TARGET_SHA" --candidate-gate "$STAGE/candidate-gate.json" \
            --qualification-run-id "$GITHUB_RUN_ID" \
            --asset Intentive.zip="$STAGE/assets/Intentive.zip" \
            --asset intentive.dmg="$STAGE/assets/intentive.dmg" \
            --asset Intentive.Beta.zip="$STAGE/assets/Intentive.Beta.zip" \
            --asset intentive-beta.dmg="$STAGE/assets/intentive-beta.dmg" \
            --evidence "$STAGE/qualification-evidence.json"

      - name: Upload canonical qualification evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-qualification-evidence-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/desktop-owner-qualification/qualification-evidence.json
          if-no-files-found: error
          overwrite: false

      - name: Upload backend compatibility diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: desktop-qualification-backend-compatibility-${{ inputs.release_tag }}-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-owner-qualification/backend-compatibility.json
          if-no-files-found: error
          overwrite: false

      - name: Create release app token for final evidence publication
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INTENTIVE_RELEASE_APP_ID }}
          private-key: ${{ secrets.INTENTIVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Attach immutable qualification evidence
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          STAGE: ${{ runner.temp }}/desktop-owner-qualification
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
        run: |
          set -euo pipefail
          existing=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets \
            --jq '[.assets[].name | select(startswith("qualification-evidence-"))] | length')
          test "$existing" = 0
          digest=$(sha256sum "$STAGE/qualification-evidence.json" | awk '{print $1}')
          asset="qualification-evidence-${TARGET_SHA}-${digest}.json"
          cp "$STAGE/qualification-evidence.json" "$STAGE/$asset"
          gh release upload "$RELEASE_TAG" --repo "$REPO" "$STAGE/$asset"
          echo "qualified=true" >> "$GITHUB_OUTPUT"

  verdict:
    needs: qualify-owner-evidence
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require exact owner qualification evidence
        env:
          QUALIFIED: ${{ needs.qualify-owner-evidence.outputs.qualified }}
        run: test "$QUALIFIED" = true
