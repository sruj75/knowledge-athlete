name: Auto Deploy Backend to Development

on:
  workflow_run:
    workflows: ["Release Eligibility"]
    branches: [main]
    types: [completed]

# Share the development backend mutation domain with manual deploys and traffic repair.
concurrency:
  group: deploy-backend-stack-development
  cancel-in-progress: false

env:
  SERVICE: backend
  REGION: us-west1
  CHAT_CONTRACT_VERSION: '2'
  # Cloud Run tags are service-scoped. Reusing this tag atomically moves each
  # service's candidate URL without accumulating stale no-traffic routes.
  CANDIDATE_TAG: candidate

jobs:
  scope:
    name: Decide backend deployment scope
    # This unprivileged decision runs before source admission, Firestore
    # readiness, image work, or any cloud mutation. workflow_run does not
    # support a safe workflow-level paths filter, so inspect its immutable SHA.
    permissions:
      contents: 'read'
    runs-on: ubuntu-latest
    outputs:
      applies: ${{ steps.scope.outputs.applies }}
    steps:
      - name: Checkout triggering main commit for scope decision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The parent diff is the only local scope proof required here. Current
          # main/supersession proof below is bounded to read-only GitHub API calls.
          fetch-depth: 2

      - name: Decide whether the triggering commit can affect the backend deployment
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${RELEASE_SHA}^{commit}"; then
            echo "Cannot resolve triggering Release Eligibility SHA: $RELEASE_SHA" >&2
            exit 1
          fi

          # The scope checkout is intentionally shallow. A stale Release
          # Eligibility result may be a green no-op only after two bounded,
          # read-only GitHub API proofs bind the current main and comparison
          # identities. Any API, JSON, or identity ambiguity falls through to
          # the privileged current-main source-admission guard below.
          api_base="${GITHUB_API_URL:-https://api.github.com}"
          ref_path="$(mktemp)"
          compare_path="$(mktemp)"
          trap 'rm -f "$ref_path" "$compare_path"' EXIT
          api_headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          ref_status="$(curl --silent --show-error --output "$ref_path" --write-out '%{http_code}' \
            "${api_headers[@]}" \
            "$api_base/repos/$GITHUB_REPOSITORY/git/ref/heads/main" || true)"
          if [[ "$ref_status" != "200" ]] || ! main_sha="$(jq -er '
            if .ref == "refs/heads/main" and .object.type == "commit" and (.object.sha | test("^[0-9a-f]{40}$"))
            then .object.sha else error("unexpected main ref identity") end
          ' "$ref_path" 2>/dev/null)"; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend development deploy scope"
              echo "In scope: supersession API proof was unavailable or ambiguous; preserving fail-closed source admission."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          compare_status="$(curl --silent --show-error --output "$compare_path" --write-out '%{http_code}' \
            "${api_headers[@]}" \
            "$api_base/repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$main_sha" || true)"
          if [[ "$compare_status" != "200" ]] || ! comparison="$(jq -er \
            --arg release_sha "$RELEASE_SHA" \
            --arg main_sha "$main_sha" '
              if .base_commit.sha == $release_sha and .head_commit.sha == $main_sha and
                (.status == "behind" or .status == "ahead" or .status == "identical" or .status == "diverged")
              then .status else error("unexpected comparison identity") end
            ' "$compare_path" 2>/dev/null)"; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend development deploy scope"
              echo "In scope: supersession API proof was unavailable or ambiguous; preserving fail-closed source admission."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$comparison" == "behind" ]]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend development deploy superseded no-op"
              echo "Green no-op: GitHub compare confirmed triggering SHA $RELEASE_SHA is behind current main $main_sha."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! parent_sha="$(git rev-parse "${RELEASE_SHA}^" 2>/dev/null)"; then
            # An unavailable parent is uncertain scope: retain the existing
            # exact-SHA admission and deployment path rather than skip.
            echo "applies=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend development deploy scope"
              echo "In scope: could not resolve the triggering commit parent."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_files="$(git diff --name-only "$parent_sha" "$RELEASE_SHA")"
          printf 'Changed files for %s:\n%s\n' "$RELEASE_SHA" "$changed_files"
          if grep -Eq '^(backend/|\.github/workflows/(gcp_backend_auto_dev|gcp_backend|release-eligibility)\.yml$|\.github/actions/release-eligibility/|\.github/scripts/(verify_auto_backend_release_admission|desktop_release_manifest|desktop_qualification_admission|desktop_qualification_evidence)\.py$)' <<<"$changed_files"; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend development deploy scope"
              echo "In scope: the triggering commit can affect backend runtime or deployment inputs."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend development deploy no-op"
              echo "Green no-op: the triggering commit cannot affect backend runtime or deployment inputs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  firestore_readiness:
    # A workflow_run can access deployment credentials, so never run source
    # code until the first completed proof identifies the exact current commit
    # on this repository's main branch. Every later checkout and release vector
    # uses that admitted SHA rather than a mutable default branch ref.
    needs: scope
    if: >-
      needs.scope.outputs.applies == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: development
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    outputs:
      admitted_sha: ${{ steps.admitted_source.outputs.admitted_sha }}
    steps:
      # This checks out current main solely to run the guard script. Source
      # selected by the workflow_run is not checked out or executed until the
      # guard establishes it is still this exact main commit.
      - name: Checkout current main for automatic source admission
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Release Eligibility proof is current main
        id: admitted_source
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse --verify 'origin/main^{commit}')"
          checkout_sha="$(git rev-parse --verify HEAD)"
          python3 .github/scripts/verify_auto_backend_release_admission.py \
            --sha "$RELEASE_SHA" \
            --main-sha "$main_sha" \
            --checkout-sha "$checkout_sha" \
            --run-attempt "$RELEASE_RUN_ATTEMPT"
          printf 'admitted_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require read-only Firestore credentials
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT: ${{ vars.GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT }}
          RUNTIME_GCP_PROJECT_ID: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT"
          test -n "$RUNTIME_GCP_PROJECT_ID"

      - name: Checkout admitted Firestore source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.admitted_source.outputs.admitted_sha }}

      - name: Google Auth for read-only Firestore inventory
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify read-only Firestore credentials target the development runtime project
        env:
          RUNTIME_GCP_PROJECT_ID: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          credential_project="$(gcloud config get-value project 2>/dev/null)"
          if [[ -z "$credential_project" || "$credential_project" == "(unset)" ]]; then
            echo "::error title=Missing Firestore credential project::The read-only Firestore credentials do not select a GCP project."
            exit 1
          fi
          if [[ "$credential_project" != "$RUNTIME_GCP_PROJECT_ID" ]]; then
            echo "::error title=Firestore project mismatch::Read-only Firestore credentials target $credential_project, but RUNTIME_GCP_PROJECT_ID is $RUNTIME_GCP_PROJECT_ID."
            exit 1
          fi

      - name: Verify serving Firestore indexes
        id: firestore_readiness
        env:
          FIRESTORE_PROPOSAL_PATH: ${{ runner.temp }}/firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}.json
          FIRESTORE_SOURCE_COMMIT: ${{ steps.admitted_source.outputs.admitted_sha }}
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --check-only \
            --proposal-output "$FIRESTORE_PROPOSAL_PATH" \
            --source-commit "$FIRESTORE_SOURCE_COMMIT" \
            --proposal-ttl-seconds 3600

      - name: Validate blocked Firestore schema proposal
        id: validate_firestore_proposal
        if: ${{ failure() && steps.firestore_readiness.outcome == 'failure' }}
        env:
          FIRESTORE_PROPOSAL_PATH: ${{ runner.temp }}/firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}.json
          FIRESTORE_SOURCE_COMMIT: ${{ steps.admitted_source.outputs.admitted_sha }}
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --validate-proposal "$FIRESTORE_PROPOSAL_PATH" \
            --source-commit "$FIRESTORE_SOURCE_COMMIT" \
            --proposal-ttl-seconds 3600

      - name: Preserve blocked Firestore schema proposal
        if: ${{ failure() && steps.firestore_readiness.outcome == 'failure' && steps.validate_firestore_proposal.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        env:
          FIRESTORE_PROPOSAL_PATH: ${{ runner.temp }}/firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}.json
        with:
          name: firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FIRESTORE_PROPOSAL_PATH }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: firestore_readiness
    environment: development
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    env:
      BACKEND_CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
    steps:
      # To workaround "no space left on device" issue of GitHub-hosted runner
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.firestore_readiness.outputs.admitted_sha }}

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to regional Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute immutable image identity
        id: image-tag
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          IMAGE_REPOSITORY="us-west1-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE}"
          {
            echo "full_sha=${FULL_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "repository=${IMAGE_REPOSITORY}"
            echo "image_ref=${IMAGE_REPOSITORY}:${FULL_SHA}"
            echo "revision_suffix=${SHORT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Python deps for deploy scripts
        run: python3 -m pip install -q pyyaml

      - name: Resolve canonical account-deletion task target
        id: account-deletion-target
        env:
          ACCOUNT_DELETION_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_TASKS_INVOKER_SA }}
          BACKEND_CANONICAL_URL: ${{ vars.BACKEND_CANONICAL_URL }}
        run: |
          set -euo pipefail
          BACKEND_URL="${BACKEND_CANONICAL_URL%/}"
          test -n "$BACKEND_URL"
          [[ "$BACKEND_URL" =~ ^https://[^/]+\.run\.app$ ]]
          test -n "$ACCOUNT_DELETION_TASKS_INVOKER_SA"
          HANDLER_URL="${BACKEND_URL}/v1/users/account-deletion-wipes/run"
          {
            echo "backend_url=${BACKEND_URL}"
            echo "handler_url=${HANDLER_URL}"
            echo "oidc_audience=${HANDLER_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight Cloud Run deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLIENT_SECRET_VERSION: ${{ vars.GOOGLE_CLIENT_SECRET_VERSION }}
          LANGFUSE_PUBLIC_KEY_VERSION: ${{ vars.LANGFUSE_PUBLIC_KEY_VERSION }}
          LANGFUSE_SECRET_KEY_VERSION: ${{ vars.LANGFUSE_SECRET_KEY_VERSION }}
          MODULATE_API_KEY_VERSION: ${{ vars.MODULATE_API_KEY_VERSION }}
          GEMINI_API_KEY_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
          OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
          FIREBASE_API_KEY_VERSION: ${{ vars.FIREBASE_API_KEY_VERSION }}
          REDIS_DB_PASSWORD_VERSION: ${{ vars.REDIS_DB_PASSWORD_VERSION }}
        run: |
          python3 backend/scripts/preflight-cloud-run-deploy.py \
            --env dev \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --check-secrets \
            --check-traffic \
            --repair-traffic

      - name: Validate backend runtime env before deploy
        run: |
          python3 backend/scripts/validate-backend-runtime-env.py --env dev --check-workflows --check-rendered-cloud-run

      - name: Build runtime image
        id: build-runtime-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image-tag.outputs.image_ref }}
          cache-from: type=registry,ref=${{ steps.image-tag.outputs.repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.image-tag.outputs.repository }}:buildcache,mode=max

      - name: Capture immutable runtime image
        id: push-runtime-image
        run: |
          set -euo pipefail
          image="${{ steps.image-tag.outputs.image_ref }}"
          digest="${{ steps.build-runtime-image.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: published backend image returned invalid digest $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=${image}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify published runtime image by digest
        run: |
          image="${{ steps.push-runtime-image.outputs.immutable_ref }}"
          docker pull "$image"
          python3 backend/scripts/runtime_image_contracts.py smoke --dockerfile backend/Dockerfile --image "$image"

      - name: Render backend runtime env
        id: runtime-env
        env:
          BACKEND_RUNTIME_SERVICE_ACCOUNT: ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RUNTIME_GCP_PROJECT_ID: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
          FIREBASE_AUTH_PROJECT_ID: ${{ vars.FIREBASE_AUTH_PROJECT_ID }}
          ACCOUNT_DELETION_HANDLER_URL: ${{ steps.account-deletion-target.outputs.handler_url }}
          ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE: ${{ steps.account-deletion-target.outputs.oidc_audience }}
          ACCOUNT_DELETION_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_TASKS_INVOKER_SA }}
          ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE: ${{ vars.ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE }}
          ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          REDIS_DB_HOST: ${{ vars.REDIS_DB_HOST }}
          REDIS_DB_PORT: ${{ vars.REDIS_DB_PORT }}
          REDIS_DB_CA_CERT_PEM: ${{ vars.REDIS_DB_CA_CERT_PEM }}
          BUCKET_DESKTOP_UPDATES: ${{ vars.BUCKET_DESKTOP_UPDATES }}
          GOOGLE_CLIENT_SECRET_VERSION: ${{ vars.GOOGLE_CLIENT_SECRET_VERSION }}
          LANGFUSE_PUBLIC_KEY_VERSION: ${{ vars.LANGFUSE_PUBLIC_KEY_VERSION }}
          LANGFUSE_SECRET_KEY_VERSION: ${{ vars.LANGFUSE_SECRET_KEY_VERSION }}
          MODULATE_API_KEY_VERSION: ${{ vars.MODULATE_API_KEY_VERSION }}
          GEMINI_API_KEY_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
          OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
          FIREBASE_API_KEY_VERSION: ${{ vars.FIREBASE_API_KEY_VERSION }}
          REDIS_DB_PASSWORD_VERSION: ${{ vars.REDIS_DB_PASSWORD_VERSION }}
        run: |
          python3 backend/scripts/render_backend_runtime_env.py --env dev >> "$GITHUB_OUTPUT"

      - name: Check development Cloud Run runtime bindings
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLIENT_SECRET_VERSION: ${{ vars.GOOGLE_CLIENT_SECRET_VERSION }}
          LANGFUSE_PUBLIC_KEY_VERSION: ${{ vars.LANGFUSE_PUBLIC_KEY_VERSION }}
          LANGFUSE_SECRET_KEY_VERSION: ${{ vars.LANGFUSE_SECRET_KEY_VERSION }}
          MODULATE_API_KEY_VERSION: ${{ vars.MODULATE_API_KEY_VERSION }}
          GEMINI_API_KEY_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
          OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
          FIREBASE_API_KEY_VERSION: ${{ vars.FIREBASE_API_KEY_VERSION }}
          REDIS_DB_PASSWORD_VERSION: ${{ vars.REDIS_DB_PASSWORD_VERSION }}
        run: >-
          python3 backend/scripts/preflight-cloud-run-deploy.py
          --env dev
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ env.REGION }}"
          --check-runtime-bindings

      - name: Deploy owned Cloud Run service
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ steps.push-runtime-image.outputs.immutable_ref }}
          no_traffic: true
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          flags: >-
            --revision-suffix=${{ steps.image-tag.outputs.revision_suffix }}
            --tag=${{ env.CANDIDATE_TAG }}
            ${{ steps.runtime-env.outputs.cloud_run_flags }}
            ${{ steps.runtime-env.outputs.backend_flags }}
          env_vars: ${{ steps.runtime-env.outputs.backend_env_vars }}
          secrets: ${{ steps.runtime-env.outputs.backend_secrets }}

      - name: Capture owned Cloud Run revision
        id: capture-backend-revision
        run: |
          test -n "$CLOUD_RUN_SERVICE"
          echo "revision=${CLOUD_RUN_SERVICE}-${{ steps.image-tag.outputs.revision_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Validate discovered canonical service URL
        env:
          EXPECTED_BACKEND_URL: ${{ steps.account-deletion-target.outputs.backend_url }}
        run: |
          set -euo pipefail
          discovered="$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')"
          [[ "$discovered" =~ ^https://[^/]+\.run\.app$ ]]
          test "$discovered" = "$EXPECTED_BACKEND_URL"

      - name: Configure account-deletion task identity and queue
        env:
          TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_TASKS_INVOKER_SA }}
          LEGACY_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA }}
        run: |
          set -euo pipefail
          test -n "$TASKS_INVOKER_SA"
          test -n "$LEGACY_TASKS_INVOKER_SA"
          for signer in "$TASKS_INVOKER_SA" "$LEGACY_TASKS_INVOKER_SA"; do
            gcloud run services add-iam-policy-binding "${{ env.CLOUD_RUN_SERVICE }}" \
              --region="${{ env.REGION }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --member="serviceAccount:${signer}" \
              --role=roles/run.invoker \
              --quiet
          done
          if gcloud tasks queues describe account-deletion \
            --location="${{ env.REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud tasks queues update account-deletion \
              --location="${{ env.REGION }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --max-attempts=5 \
              --max-concurrent-dispatches=1
          else
            gcloud tasks queues create account-deletion \
              --location="${{ env.REGION }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --max-attempts=5 \
              --max-concurrent-dispatches=1
          fi

      - name: Wait for Cloud Run revisions to become ready
        run: |
          python3 backend/scripts/preflight-cloud-run-deploy.py \
            --env dev \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --wait-revision-ready "${{ env.CLOUD_RUN_SERVICE }}"=${{ steps.capture-backend-revision.outputs.revision }}

      - name: Verify canonical backend image lineage
        id: verify-image-lineage
        env:
          BUILD_IMAGE_REF: ${{ steps.push-runtime-image.outputs.immutable_ref }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          runtime_image_ref="$(gcloud run revisions describe "${{ steps.capture-backend-revision.outputs.revision }}" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.imageDigest)')"
          runtime_digest="$(python3 backend/scripts/verify_backend_image_lineage.py \
            --build-image-ref="$BUILD_IMAGE_REF" \
            --runtime-image-ref="$runtime_image_ref" \
            --source-sha="${{ steps.image-tag.outputs.full_sha }}" \
            --revision="${{ steps.capture-backend-revision.outputs.revision }}" \
            --evidence-path=artifacts/dev-backend-image-lineage.json)"
          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"

      - name: Capture exact no-traffic candidate URLs
        id: candidate-urls
        run: |
          set -euo pipefail
          backend_url="$(python3 backend/scripts/resolve_cloud_run_tagged_url.py \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --service="${{ env.CLOUD_RUN_SERVICE }}" \
            --revision=${{ steps.capture-backend-revision.outputs.revision }} \
            --tag=${{ env.CANDIDATE_TAG }})"
          backend_audience="$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" --project=${{ vars.GCP_PROJECT_ID }} --region=${{ env.REGION }} --format='value(status.url)')"
          test -n "$backend_audience"
          {
            echo "backend_url=${backend_url}"
            echo "backend_audience=${backend_audience}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate backend runtime env after deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BACKEND_RUNTIME_SERVICE_ACCOUNT: ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }}
          GOOGLE_CLIENT_SECRET_VERSION: ${{ vars.GOOGLE_CLIENT_SECRET_VERSION }}
          LANGFUSE_PUBLIC_KEY_VERSION: ${{ vars.LANGFUSE_PUBLIC_KEY_VERSION }}
          LANGFUSE_SECRET_KEY_VERSION: ${{ vars.LANGFUSE_SECRET_KEY_VERSION }}
          MODULATE_API_KEY_VERSION: ${{ vars.MODULATE_API_KEY_VERSION }}
          GEMINI_API_KEY_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
          OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
          FIREBASE_API_KEY_VERSION: ${{ vars.FIREBASE_API_KEY_VERSION }}
          REDIS_DB_PASSWORD_VERSION: ${{ vars.REDIS_DB_PASSWORD_VERSION }}
        run: |
          python3 backend/scripts/validate-backend-runtime-env.py --env dev --check-workflows --check-live-cloud-run

      - name: Smoke no-traffic Cloud Run candidates
        run: |
          python3 backend/scripts/run_dev_candidate_acceptance.py \
            --candidate backend=${{ steps.candidate-urls.outputs.backend_url }} \
            --audience backend=${{ steps.candidate-urls.outputs.backend_audience }} \
            --evidence-path artifacts/dev-backend-candidate-acceptance.json

      # This is the no-traffic Cloud Run acceptance boundary.
      - name: Accept no-traffic Cloud Run candidate
        run: |
          python3 backend/scripts/verify_backend_release_vector.py \
            --candidate \
            --commit-sha "${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --short-sha "${{ steps.image-tag.outputs.short_sha }}" \
            --deploy-run-id "${{ github.run_id }}" \
            --deploy-run-attempt "${{ github.run_attempt }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --environment dev \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --expected-image "${{ steps.push-runtime-image.outputs.immutable_ref }}" \
            --evidence-path artifacts/dev-backend-cloud-run-candidate-release-vector.json

      - name: Mint backend candidate probe identity
        run: |
          set -euo pipefail
          token_file="$(mktemp "$RUNNER_TEMP/backend-candidate-probe.XXXXXX")"
          chmod 600 "$token_file"
          echo "BACKEND_CANDIDATE_PROBE_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          python3 backend/scripts/firebase_release_probe_token.py \
            --secret-project "${{ vars.GCP_PROJECT_ID }}" \
            --firebase-project "${{ vars.FIREBASE_AUTH_PROJECT_ID }}" \
            --token-output "$token_file"

      - name: Prove canonical candidate chat compatibility
        run: |
          python3 .github/scripts/backend_candidate_probe.py \
            --base-url="${{ steps.candidate-urls.outputs.backend_url }}" \
            --bearer-token-file="$BACKEND_CANDIDATE_PROBE_TOKEN_FILE" \
            --source-sha="${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --expected-contract-version="$CHAT_CONTRACT_VERSION" \
            --expected-revision="${{ steps.capture-backend-revision.outputs.revision }}" \
            --expected-image-digest="${{ steps.verify-image-lineage.outputs.runtime_digest }}" \
            --candidate-tag="$CANDIDATE_TAG" \
            --workflow-run-id="$GITHUB_RUN_ID" \
            --evidence-path=artifacts/dev-backend-chat-candidate.json

      - name: Prove canonical candidate managed Gemini realtime path
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            probe_exit=0
            scripts/voice-provider-probe.sh "${{ steps.candidate-urls.outputs.backend_url }}" \
              --bearer-token-file="$BACKEND_CANDIDATE_PROBE_TOKEN_FILE" || probe_exit=$?
            if [[ "$probe_exit" -eq 0 ]]; then
              break
            fi
            if [[ "$probe_exit" -ne 75 || "$attempt" -eq 3 ]]; then
              echo "Managed Gemini realtime proof failed." >&2
              exit "$probe_exit"
            fi
            echo "Retrying Gemini realtime proof after a retryable upstream failure ($attempt/3)."
            sleep 5
          done

      - name: Delete backend candidate probe identity
        if: ${{ always() }}
        run: |
          if [[ -n "${BACKEND_CANDIDATE_PROBE_TOKEN_FILE:-}" ]]; then
            rm -f -- "$BACKEND_CANDIDATE_PROBE_TOKEN_FILE"
          fi

      - name: Verify exact candidate composition
        run: |
          python3 backend/scripts/verify_backend_release_vector.py \
            --candidate \
            --commit-sha "${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --short-sha "${{ steps.image-tag.outputs.short_sha }}" \
            --deploy-run-id "${{ github.run_id }}" \
            --deploy-run-attempt "${{ github.run_attempt }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --environment dev \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --expected-image "${{ steps.push-runtime-image.outputs.immutable_ref }}" \
            --evidence-path artifacts/dev-backend-deployment-composition.json

      - name: Capture Cloud Run pre-promotion traffic snapshot
        id: cloud-run-traffic-snapshot
        run: |
          python3 backend/scripts/cloud_run_traffic_snapshot.py capture \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --output artifacts/dev-backend-cloud-run-pre-promotion-traffic-snapshot.json

      - name: Verify validated revisions are still current
        run: |
          test "$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" --project=${{ vars.GCP_PROJECT_ID }} --region=${{ env.REGION }} --format='value(status.latestCreatedRevisionName)')" = "${{ steps.capture-backend-revision.outputs.revision }}"

      - name: Shift Cloud Run traffic to validated revisions
        id: shift-cloud-run-traffic
        run: |
          gcloud run services update-traffic "${{ env.CLOUD_RUN_SERVICE }}" --project=${{ vars.GCP_PROJECT_ID }} --region=${{ env.REGION }} --to-revisions=${{ steps.capture-backend-revision.outputs.revision }}=100 --quiet

      # The no-traffic candidate gate proves readiness; this post-promotion
      # read verifies that every serving tier actually converged on the same
      # attempt-scoped release vector.
      - name: Verify serving backend release vector
        id: verify-serving-release-vector
        run: |
          python3 backend/scripts/verify_backend_release_vector.py \
            --commit-sha "${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --short-sha "${{ steps.image-tag.outputs.short_sha }}" \
            --deploy-run-id "${{ github.run_id }}" \
            --deploy-run-attempt "${{ github.run_attempt }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --environment dev \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --expected-image "${{ steps.push-runtime-image.outputs.immutable_ref }}" \
            --evidence-path artifacts/dev-backend-serving-release-vector.json

      - name: Restore Cloud Run traffic snapshot after failed promotion
        if: ${{ failure() && steps.cloud-run-traffic-snapshot.outcome == 'success' && (steps.shift-cloud-run-traffic.outcome == 'failure' || steps.verify-serving-release-vector.outcome == 'failure') }}
        run: |
          python3 backend/scripts/cloud_run_traffic_snapshot.py restore \
            --snapshot artifacts/dev-backend-cloud-run-pre-promotion-traffic-snapshot.json \
            --evidence-path artifacts/dev-backend-cloud-run-traffic-restore.json

      - name: Cloud Run deploy status report
        if: always()
        run: |
          python3 backend/scripts/deploy_status_report.py \
            --env dev \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --include-cloud-run \
            --cloud-run-service "${{ env.CLOUD_RUN_SERVICE }}" \
            --expect-cloud-run-traffic "${{ env.CLOUD_RUN_SERVICE }}"=${{ steps.capture-backend-revision.outputs.revision }} \
            --candidate-acceptance-manifest backend/deploy/dev_candidate_acceptance.json \
            --candidate-acceptance-evidence artifacts/dev-backend-candidate-acceptance.json \
            --candidate-status-output artifacts/dev-backend-candidate-status.json

      - name: Upload deployment acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-backend-deployment-acceptance-${{ github.run_id }}
          path: |
            artifacts/dev-backend-cloud-run-candidate-release-vector.json
            artifacts/dev-backend-image-lineage.json
            artifacts/dev-backend-chat-candidate.json
            artifacts/dev-backend-deployment-composition.json
            artifacts/dev-backend-cloud-run-pre-promotion-traffic-snapshot.json
            artifacts/dev-backend-serving-release-vector.json
            artifacts/dev-backend-candidate-acceptance.json
            artifacts/dev-backend-candidate-status.json
            artifacts/dev-backend-cloud-run-traffic-restore.json
          if-no-files-found: warn

      - name: Show Output
        run: echo "Backend deployed to development environment"
