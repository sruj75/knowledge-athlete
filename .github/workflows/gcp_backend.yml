name: Deploy Backend to Cloud RUN

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
      release_sha:
        description: 'Exact main SHA with a successful Release Eligibility proof (deploy mode only)'
        required: false
        default: ''
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''
      mode:
        description: 'Workflow mode'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - repair-traffic-only
          - foundation-readiness
          - artifact-cleanup-dry-run
      # Break-glass: the eligibility proof requires a *successful* Release
      # Eligibility push-run on this exact SHA. A flaky or red check therefore
      # poisons that SHA permanently -- rerunning does not retroactively make
      # the original run succeed, so the only other recovery is pushing a new
      # commit to main and waiting for a full green run. That is unacceptable
      # for a hotfix, so this hatch exists.
      #
      # It does NOT relax the property that matters: the SHA must still be an
      # ancestor of main, so unreviewed code can never reach production.
      skip_eligibility_proof:
        description: 'Break-glass: deploy without a Release Eligibility proof (still requires a merged main SHA)'
        required: false
        default: false
        type: boolean
      break_glass_confirm:
        description: 'Type deploy-without-proof when skip_eligibility_proof is set'
        required: false
        default: ''
      break_glass_reason:
        description: 'Why the eligibility proof is unavailable (required with skip_eligibility_proof)'
        required: false
        default: ''

# Cloud Run revision promotion and traffic repair share one environment-scoped
# mutation domain across the backend deploy workflows.
concurrency:
  group: deploy-backend-stack-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  SERVICE: backend
  REGION: us-west1
  CHAT_CONTRACT_VERSION: '2'
  CANDIDATE_TAG: backend-gate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate-production-boundary:
    if: >-
      github.event.inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported production deployment boundary before side effects
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" != "development" && "$DEPLOY_ENVIRONMENT" != "prod" ]]; then
            echo "Invalid environment: $DEPLOY_ENVIRONMENT. Must be 'development' or 'prod'." >&2
            exit 1
          fi

  repair-traffic:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'repair-traffic-only'
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: 'write'
    runs-on: ubuntu-latest
    env:
      CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
    steps:
      - name: Validate Environment Input
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Restore Cloud Run traffic spec to currently serving revisions
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUD_RUN_SERVICE"
          service_json="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json)"
          serving_revision="$(jq -er '
            . as $service
            | [(.status.traffic // [])[]
                | select((.percent // 0) == 100)
                | if (.revisionName // "") != "" then .revisionName
                  elif .latestRevision == true then ($service.status.latestReadyRevisionName // empty)
                  else empty end]
            | if length == 1 then .[0] else empty end
          ' <<<"$service_json")"
          spec_revision="$(jq -er --arg fallback "$serving_revision" '
            [(.spec.traffic // [])[]
                | select((.percent // 0) == 100)
                | if (.revisionName // "") != "" then .revisionName
                  elif .latestRevision == true then $fallback
                  else empty end]
            | if length == 1 then .[0] else empty end
          ' <<<"$service_json")"
          if [[ ! "$serving_revision" =~ ^${CLOUD_RUN_SERVICE}-[a-z0-9-]+$ ]]; then
            echo "ERROR: Cloud Run returned an invalid serving revision for $CLOUD_RUN_SERVICE." >&2
            exit 1
          fi
          if [[ "$spec_revision" == "$serving_revision" ]]; then
            echo "$CLOUD_RUN_SERVICE already routes 100% to serving revision $serving_revision."
            exit 0
          fi
          echo "Restoring $CLOUD_RUN_SERVICE spec traffic to currently serving revision $serving_revision."
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-revisions="$serving_revision=100" \
            --quiet

      - name: Cloud Run deploy status report
        if: always()
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='yaml(metadata.name,status.url,status.latestReadyRevisionName,status.traffic)'

  foundation-maintenance:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.mode == 'foundation-readiness' ||
       github.event.inputs.mode == 'artifact-cleanup-dry-run')
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    env:
      BACKEND_CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
    steps:
      - name: Validate maintenance inputs
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" != "development" && "$DEPLOY_ENVIRONMENT" != "prod" ]]; then
            echo "Invalid environment: $DEPLOY_ENVIRONMENT. Must be 'development' or 'prod'." >&2
            exit 1
          fi

      - name: Checkout current main foundation controls
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Google Auth for foundation readiness
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud for foundation readiness
        uses: google-github-actions/setup-gcloud@v3

      - name: Compare sanitized live foundation with the manifest
        if: ${{ github.event.inputs.mode == 'foundation-readiness' }}
        env:
          ALERT_NOTIFICATION_CHANNEL: ${{ vars.ALERT_NOTIFICATION_CHANNEL }}
          ACCOUNT_DELETION_HANDLER_URL: ${{ vars.ACCOUNT_DELETION_HANDLER_URL }}
          ACCOUNT_DELETION_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_TASKS_INVOKER_SA }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          BACKEND_RUNTIME_SERVICE_ACCOUNT: ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }}
          BUCKET_DESKTOP_UPDATES: ${{ vars.BUCKET_DESKTOP_UPDATES }}
          GCP_BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT: ${{ vars.GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT }}
          GCP_FIRESTORE_WRITER_SERVICE_ACCOUNT: ${{ vars.GCP_FIRESTORE_WRITER_SERVICE_ACCOUNT }}
          GCP_MONTHLY_BUDGET_AMOUNT: ${{ vars.GCP_MONTHLY_BUDGET_AMOUNT }}
          GCP_MONTHLY_BUDGET_CURRENCY: ${{ vars.GCP_MONTHLY_BUDGET_CURRENCY }}
          GCP_BUDGET_RECIPIENTS: ${{ vars.GCP_BUDGET_RECIPIENTS }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          REDIS_DB_CA_CERT_PEM: ${{ vars.REDIS_DB_CA_CERT_PEM }}
          REDIS_DB_HOST: ${{ vars.REDIS_DB_HOST }}
          REDIS_DB_PORT: ${{ vars.REDIS_DB_PORT }}
          RUNTIME_GCP_PROJECT_ID: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          manifest_env=dev
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            manifest_env=prod
          fi
          python3 backend/scripts/foundation_drift.py --env="$manifest_env" --check-live

      - name: Capture Artifact Registry cleanup dry run
        if: ${{ github.event.inputs.mode == 'artifact-cleanup-dry-run' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          registry="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY"
          gcloud artifacts docker images list "$registry" \
            --project="$PROJECT_ID" \
            --include-tags \
            --format=json > artifacts/backend-artifact-inventory.json
          test -n "$CLOUD_RUN_SERVICE"
          gcloud run revisions list \
            --service="$CLOUD_RUN_SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(spec.containers[0].image)' \
            | sort -u > artifacts/backend-protected-images.txt
          python3 backend/scripts/artifact_cleanup_policy.py \
            --inventory artifacts/backend-artifact-inventory.json \
            --protected-name-file artifacts/backend-protected-images.txt \
            --output artifacts/backend-artifact-cleanup-dry-run.json

      - name: Upload foundation maintenance evidence
        if: ${{ always() && github.event.inputs.mode == 'artifact-cleanup-dry-run' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifact-cleanup-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/backend-artifact-cleanup-dry-run.json

  firestore_readiness:
    needs: validate-production-boundary
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'deploy'
    environment: ${{ github.event.inputs.environment }}
    permissions:
      actions: 'read'
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    outputs:
      admitted_sha: ${{ steps.admitted_source.outputs.admitted_sha }}
      break_glass: ${{ steps.admitted_source.outputs.break_glass }}
    steps:
      - name: Validate Firestore readiness inputs
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" != "development" && "$DEPLOY_ENVIRONMENT" != "prod" ]]; then
            echo "Invalid environment: $DEPLOY_ENVIRONMENT. Must be 'development' or 'prod'."
            exit 1
          fi
      - name: Checkout current main for source admission
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact admitted main source
        id: admitted_source
        env:
          DEPLOY_SHA: ${{ github.event.inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
          SKIP_PROOF: ${{ github.event.inputs.skip_eligibility_proof }}
          BREAK_GLASS_CONFIRM: ${{ github.event.inputs.break_glass_confirm }}
          BREAK_GLASS_REASON: ${{ github.event.inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ || "$DEPLOY_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "ERROR: release_sha must be one non-zero, lowercase, full commit SHA."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse --verify 'origin/main^{commit}')"
          git cat-file -e "${DEPLOY_SHA}^{commit}"

          # Always enforced, break-glass or not: only merged main code deploys.
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$main_sha"; then
            echo "ERROR: release_sha is not an ancestor of origin/main; only merged code may deploy."
            exit 1
          fi

          if [[ "${SKIP_PROOF:-false}" == "true" ]]; then
            if [[ "$BREAK_GLASS_CONFIRM" != "deploy-without-proof" ]]; then
              echo "ERROR: skip_eligibility_proof requires break_glass_confirm=deploy-without-proof." >&2
              exit 1
            fi
            if [[ -z "${BREAK_GLASS_REASON// }" ]]; then
              echo "ERROR: skip_eligibility_proof requires a non-empty break_glass_reason." >&2
              exit 1
            fi
            echo "::warning::Release Eligibility proof skipped for ${DEPLOY_SHA}: ${BREAK_GLASS_REASON}"
            printf 'break_glass=true\n' >> "$GITHUB_OUTPUT"
          else
            proof_path="${RUNNER_TEMP}/release-eligibility-${DEPLOY_SHA}.json"
            gh api -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release-eligibility.yml/runs?event=push&branch=main&status=completed&head_sha=${DEPLOY_SHA}&per_page=100" \
              > "$proof_path"
            python3 .github/scripts/verify_backend_release_admission.py \
              --sha "$DEPLOY_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow-runs "$proof_path"
            printf 'break_glass=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'admitted_sha=%s\n' "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Require read-only Firestore credentials
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT: ${{ vars.GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT }}
          RUNTIME_GCP_PROJECT_ID: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT"
          test -n "$RUNTIME_GCP_PROJECT_ID"

      - name: Checkout admitted Firestore source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.admitted_source.outputs.admitted_sha }}

      - name: Google Auth for read-only Firestore inventory
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify serving Firestore indexes
        id: firestore_readiness
        env:
          FIRESTORE_PROPOSAL_PATH: ${{ runner.temp }}/firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}.json
          FIRESTORE_SOURCE_COMMIT: ${{ steps.admitted_source.outputs.admitted_sha }}
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --check-only \
            --proposal-output "$FIRESTORE_PROPOSAL_PATH" \
            --source-commit "$FIRESTORE_SOURCE_COMMIT" \
            --proposal-ttl-seconds 3600

      - name: Validate blocked Firestore schema proposal
        id: validate_firestore_proposal
        if: ${{ failure() && steps.firestore_readiness.outcome == 'failure' }}
        env:
          FIRESTORE_PROPOSAL_PATH: ${{ runner.temp }}/firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}.json
          FIRESTORE_SOURCE_COMMIT: ${{ steps.admitted_source.outputs.admitted_sha }}
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --validate-proposal "$FIRESTORE_PROPOSAL_PATH" \
            --source-commit "$FIRESTORE_SOURCE_COMMIT" \
            --proposal-ttl-seconds 3600

      - name: Preserve blocked Firestore schema proposal
        if: ${{ failure() && steps.firestore_readiness.outcome == 'failure' && steps.validate_firestore_proposal.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        env:
          FIRESTORE_PROPOSAL_PATH: ${{ runner.temp }}/firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}.json
        with:
          name: firestore-schema-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FIRESTORE_PROPOSAL_PATH }}
          if-no-files-found: error
          retention-days: 1

  # Kept out of firestore_readiness on purpose: that job is a least-privilege
  # release-proof boundary limited to actions:read/contents:read, so the audit
  # side effect gets its own job rather than widening it.
  record_break_glass:
    needs: firestore_readiness
    if: ${{ needs.firestore_readiness.outputs.break_glass == 'true' }}
    permissions:
      contents: 'read'
      issues: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Record that the eligibility proof was bypassed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          BREAK_GLASS_REASON: ${{ github.event.inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          gh issue create --repo "$REPO" \
            --title "Release Eligibility bypassed for ${DEPLOY_SHA:0:10} (${DEPLOY_ENVIRONMENT})" \
            --label release-gate-failure \
            --body "$(printf '%s\n' \
              "Backend deploy ran without a Release Eligibility proof." \
              "" \
              "- SHA: \`${DEPLOY_SHA}\` (verified ancestor of main)" \
              "- Environment: ${DEPLOY_ENVIRONMENT}" \
              "- Operator: @${GITHUB_ACTOR}" \
              "- Reason: ${BREAK_GLASS_REASON}" \
              "- Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
              "" \
              "The gate being unusable is the defect. Fix the gate, then close this.")"

  deploy:
    needs: [validate-production-boundary, firestore_readiness]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'deploy'
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    env:
      BACKEND_CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
    steps:
      - name: Validate Environment Input
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi

      # To workaround "no space left on device" issue of GitHub-hosted runner
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout workflow-owned deploy-control source
        uses: actions/checkout@v7
        with:
          # The workflow owns deployment-control behavior. Pin this source to
          # the immutable workflow revision before the admitted runtime source
          # replaces the normal workspace.
          ref: ${{ github.sha }}
          path: .workflow-source

      - name: Stage immutable workflow validation source and deploy-control scripts
        run: |
          set -euo pipefail
          workflow_source="$RUNNER_TEMP/backend-deploy-workflow-source"
          control_scripts="$RUNNER_TEMP/backend-deploy-control-scripts"
          rm -rf "$workflow_source"
          rm -rf "$control_scripts"
          mkdir -p "$workflow_source"
          cp -a .workflow-source/.github "$workflow_source/.github"
          mkdir -p "$workflow_source/scripts"
          cp .workflow-source/scripts/voice-provider-probe.sh "$workflow_source/scripts/"
          cp -a .workflow-source/backend/scripts "$control_scripts"
          rm -rf .workflow-source

      - name: Checkout admitted runtime source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.firestore_readiness.outputs.admitted_sha }}

      - name: Install immutable workflow validation source and deploy-control scripts
        run: |
          set -euo pipefail
          workflow_root="$GITHUB_WORKSPACE/.deploy-workflow-source"
          control_scripts="$GITHUB_WORKSPACE/.deploy-control/scripts"
          rm -rf "$workflow_root"
          rm -rf "$GITHUB_WORKSPACE/.deploy-control"
          mkdir -p "$workflow_root"
          mkdir -p "$(dirname "$control_scripts")"
          cp -a "$RUNNER_TEMP/backend-deploy-workflow-source/.github" "$workflow_root/.github"
          cp -a "$RUNNER_TEMP/backend-deploy-control-scripts" "$control_scripts"
          rm -rf "$RUNNER_TEMP/backend-deploy-workflow-source"
          rm -rf "$RUNNER_TEMP/backend-deploy-control-scripts"
          printf 'DEPLOY_CONTROL_SCRIPTS=%s\n' "$control_scripts" >> "$GITHUB_ENV"
          printf 'DEPLOY_WORKFLOW_ROOT=%s\n' "$workflow_root" >> "$GITHUB_ENV"

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to regional Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute immutable image identity
        id: image-tag
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          IMAGE_REPOSITORY="us-west1-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE}"
          {
            echo "full_sha=${FULL_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "repository=${IMAGE_REPOSITORY}"
            echo "image_ref=${IMAGE_REPOSITORY}:${FULL_SHA}"
            echo "revision_suffix=${SHORT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Python deps for deploy scripts
        run: python3 -m pip install -q pyyaml

      - name: Resolve canonical account-deletion task target
        id: account-deletion-target
        env:
          ACCOUNT_DELETION_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_TASKS_INVOKER_SA }}
          BACKEND_CANONICAL_URL: ${{ vars.BACKEND_CANONICAL_URL }}
        run: |
          set -euo pipefail
          BACKEND_URL="${BACKEND_CANONICAL_URL%/}"
          test -n "$BACKEND_URL"
          [[ "$BACKEND_URL" =~ ^https://[^/]+\.run\.app$ ]]
          test -n "$ACCOUNT_DELETION_TASKS_INVOKER_SA"
          HANDLER_URL="${BACKEND_URL}/v1/users/account-deletion-wipes/run"
          {
            echo "backend_url=${BACKEND_URL}"
            echo "handler_url=${HANDLER_URL}"
            echo "oidc_audience=${HANDLER_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight Cloud Run deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DESKTOP_PREVIEW_PUBLISH_KEY_VERSION: ${{ vars.DESKTOP_PREVIEW_PUBLISH_KEY_VERSION }}
          BETA_PROMOTION_TOKEN_VERSION: ${{ vars.BETA_PROMOTION_TOKEN_VERSION }}
          GOOGLE_CLIENT_SECRET_VERSION: ${{ vars.GOOGLE_CLIENT_SECRET_VERSION }}
          POSTHOG_PROJECT_API_KEY_VERSION: ${{ vars.POSTHOG_PROJECT_API_KEY_VERSION }}
          LANGFUSE_PUBLIC_KEY_VERSION: ${{ vars.LANGFUSE_PUBLIC_KEY_VERSION }}
          LANGFUSE_SECRET_KEY_VERSION: ${{ vars.LANGFUSE_SECRET_KEY_VERSION }}
          MODULATE_API_KEY_VERSION: ${{ vars.MODULATE_API_KEY_VERSION }}
          GEMINI_API_KEY_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
          OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
          FIREBASE_API_KEY_VERSION: ${{ vars.FIREBASE_API_KEY_VERSION }}
          REDIS_DB_PASSWORD_VERSION: ${{ vars.REDIS_DB_PASSWORD_VERSION }}
        run: |
          PREFLIGHT_ARGS=(
            --env ${{ vars.ENV }}
            --project ${{ vars.GCP_PROJECT_ID }}
            --region ${{ env.REGION }}
            --service "${{ env.CLOUD_RUN_SERVICE }}"
            --check-secrets
            --check-traffic
          )
          if [[ "${{ github.event.inputs.environment }}" == "prod" || "${{ github.event.inputs.environment }}" == "development" ]]; then
            PREFLIGHT_ARGS+=(--repair-traffic)
          fi
          python3 "$DEPLOY_CONTROL_SCRIPTS/preflight-cloud-run-deploy.py" "${PREFLIGHT_ARGS[@]}"

      - name: Validate backend runtime env before deploy
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/validate-backend-runtime-env.py" --env ${{ vars.ENV }} --check-workflows --workflow-root "$DEPLOY_WORKFLOW_ROOT" --check-rendered-cloud-run

      - name: Build runtime image
        id: build-runtime-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image-tag.outputs.image_ref }}
          cache-from: type=registry,ref=${{ steps.image-tag.outputs.repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.image-tag.outputs.repository }}:buildcache,mode=max

      - name: Capture immutable runtime image
        id: push-runtime-image
        run: |
          set -euo pipefail
          repository="${{ steps.image-tag.outputs.repository }}"
          digest="${{ steps.build-runtime-image.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: published backend image returned invalid digest $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=${repository}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify published runtime image by digest
        run: |
          image="${{ steps.push-runtime-image.outputs.immutable_ref }}"
          docker pull "$image"
          python3 "$DEPLOY_CONTROL_SCRIPTS/runtime_image_contracts.py" smoke --dockerfile backend/Dockerfile --image "$image"

      - name: Render backend runtime env
        id: runtime-env
        env:
          BACKEND_RUNTIME_SERVICE_ACCOUNT: ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RUNTIME_GCP_PROJECT_ID: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
          FIREBASE_AUTH_PROJECT_ID: ${{ vars.FIREBASE_AUTH_PROJECT_ID }}
          BACKEND_CANONICAL_URL: ${{ vars.BACKEND_CANONICAL_URL }}
          ACCOUNT_DELETION_HANDLER_URL: ${{ steps.account-deletion-target.outputs.handler_url }}
          ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE: ${{ steps.account-deletion-target.outputs.oidc_audience }}
          ACCOUNT_DELETION_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_TASKS_INVOKER_SA }}
          ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE: ${{ vars.ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE }}
          ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          REDIS_DB_HOST: ${{ vars.REDIS_DB_HOST }}
          REDIS_DB_PORT: ${{ vars.REDIS_DB_PORT }}
          REDIS_DB_CA_CERT_PEM: ${{ vars.REDIS_DB_CA_CERT_PEM }}
          BUCKET_DESKTOP_UPDATES: ${{ vars.BUCKET_DESKTOP_UPDATES }}
          DESKTOP_PREVIEW_PUBLISH_KEY_VERSION: ${{ vars.DESKTOP_PREVIEW_PUBLISH_KEY_VERSION }}
          BETA_PROMOTION_TOKEN_VERSION: ${{ vars.BETA_PROMOTION_TOKEN_VERSION }}
          GOOGLE_CLIENT_SECRET_VERSION: ${{ vars.GOOGLE_CLIENT_SECRET_VERSION }}
          POSTHOG_PROJECT_API_KEY_VERSION: ${{ vars.POSTHOG_PROJECT_API_KEY_VERSION }}
          LANGFUSE_PUBLIC_KEY_VERSION: ${{ vars.LANGFUSE_PUBLIC_KEY_VERSION }}
          LANGFUSE_SECRET_KEY_VERSION: ${{ vars.LANGFUSE_SECRET_KEY_VERSION }}
          MODULATE_API_KEY_VERSION: ${{ vars.MODULATE_API_KEY_VERSION }}
          GEMINI_API_KEY_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
          OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
          FIREBASE_API_KEY_VERSION: ${{ vars.FIREBASE_API_KEY_VERSION }}
          REDIS_DB_PASSWORD_VERSION: ${{ vars.REDIS_DB_PASSWORD_VERSION }}
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/render_backend_runtime_env.py" --env ${{ vars.ENV }} >> "$GITHUB_OUTPUT"

      - name: Deploy owned Cloud Run service
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ steps.push-runtime-image.outputs.immutable_ref }}
          no_traffic: true
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          flags: >-
            --revision-suffix=${{ steps.image-tag.outputs.revision_suffix }}
            --tag=${{ env.CANDIDATE_TAG }}
            ${{ steps.runtime-env.outputs.cloud_run_flags }}
            ${{ steps.runtime-env.outputs.backend_flags }}
          env_vars: ${{ steps.runtime-env.outputs.backend_env_vars }}
          secrets: ${{ steps.runtime-env.outputs.backend_secrets }}

      - name: Capture owned Cloud Run revision
        id: capture-backend-revision
        run: |
          test -n "$CLOUD_RUN_SERVICE"
          echo "revision=${CLOUD_RUN_SERVICE}-${{ steps.image-tag.outputs.revision_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Validate discovered canonical service URL
        env:
          EXPECTED_BACKEND_URL: ${{ steps.account-deletion-target.outputs.backend_url }}
        run: |
          set -euo pipefail
          gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format=json | \
            python3 backend/scripts/cloud_run_deployment_identity.py \
              --service="${{ env.CLOUD_RUN_SERVICE }}" \
              --expected-url="$EXPECTED_BACKEND_URL"

      - name: Configure account-deletion task identity and queue
        env:
          TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_TASKS_INVOKER_SA }}
          LEGACY_TASKS_INVOKER_SA: ${{ vars.ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA }}
        run: |
          set -euo pipefail
          test -n "$TASKS_INVOKER_SA"
          test -n "$LEGACY_TASKS_INVOKER_SA"
          for signer in "$TASKS_INVOKER_SA" "$LEGACY_TASKS_INVOKER_SA"; do
            gcloud run services add-iam-policy-binding "${{ env.CLOUD_RUN_SERVICE }}" \
              --region="${{ env.REGION }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --member="serviceAccount:${signer}" \
              --role=roles/run.invoker \
              --quiet
          done
          if gcloud tasks queues describe account-deletion \
            --location="${{ env.REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud tasks queues update account-deletion \
              --location="${{ env.REGION }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --max-attempts=5 \
              --max-concurrent-dispatches=1
          else
            gcloud tasks queues create account-deletion \
              --location="${{ env.REGION }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --max-attempts=5 \
              --max-concurrent-dispatches=1
          fi

      - name: Wait for Cloud Run revisions to become ready
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/preflight-cloud-run-deploy.py" \
            --env ${{ vars.ENV }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --wait-revision-ready "${{ env.CLOUD_RUN_SERVICE }}"=${{ steps.capture-backend-revision.outputs.revision }}

      - name: Verify canonical backend image lineage
        id: verify-image-lineage
        env:
          BUILD_IMAGE_REF: ${{ steps.push-runtime-image.outputs.immutable_ref }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          runtime_image_ref="$(gcloud run revisions describe "${{ steps.capture-backend-revision.outputs.revision }}" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.imageDigest)')"
          runtime_digest="$(python3 "$DEPLOY_CONTROL_SCRIPTS/verify_backend_image_lineage.py" \
            --build-image-ref="$BUILD_IMAGE_REF" \
            --runtime-image-ref="$runtime_image_ref" \
            --source-sha="${{ steps.image-tag.outputs.full_sha }}" \
            --revision="${{ steps.capture-backend-revision.outputs.revision }}" \
            --evidence-path=artifacts/backend-image-lineage.json)"
          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"

      - name: Validate backend runtime env after deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BACKEND_RUNTIME_SERVICE_ACCOUNT: ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }}
          DESKTOP_PREVIEW_PUBLISH_KEY_VERSION: ${{ vars.DESKTOP_PREVIEW_PUBLISH_KEY_VERSION }}
          BETA_PROMOTION_TOKEN_VERSION: ${{ vars.BETA_PROMOTION_TOKEN_VERSION }}
          GOOGLE_CLIENT_SECRET_VERSION: ${{ vars.GOOGLE_CLIENT_SECRET_VERSION }}
          POSTHOG_PROJECT_API_KEY_VERSION: ${{ vars.POSTHOG_PROJECT_API_KEY_VERSION }}
          LANGFUSE_PUBLIC_KEY_VERSION: ${{ vars.LANGFUSE_PUBLIC_KEY_VERSION }}
          LANGFUSE_SECRET_KEY_VERSION: ${{ vars.LANGFUSE_SECRET_KEY_VERSION }}
          MODULATE_API_KEY_VERSION: ${{ vars.MODULATE_API_KEY_VERSION }}
          GEMINI_API_KEY_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
          OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
          FIREBASE_API_KEY_VERSION: ${{ vars.FIREBASE_API_KEY_VERSION }}
          REDIS_DB_PASSWORD_VERSION: ${{ vars.REDIS_DB_PASSWORD_VERSION }}
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/validate-backend-runtime-env.py" --env ${{ vars.ENV }} --check-workflows --workflow-root "$DEPLOY_WORKFLOW_ROOT" --check-live-cloud-run

      - name: Resolve exact no-traffic candidate URL
        id: candidate-url
        run: |
          candidate_url="$(python3 "$DEPLOY_CONTROL_SCRIPTS/resolve_cloud_run_tagged_url.py" \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --service=${{ env.CLOUD_RUN_SERVICE }} \
            --revision=${{ steps.capture-backend-revision.outputs.revision }} \
            --tag="$CANDIDATE_TAG")"
          printf 'url=%s\n' "$candidate_url" >> "$GITHUB_OUTPUT"

      - name: Gate backend candidate on known audio
        if: ${{ github.event.inputs.environment == 'development' && vars.MODULATE_API_KEY_VERSION != '' }}
        uses: ./.github/actions/transcription-release-candidate-probe
        with:
          candidate_api_url: ${{ steps.candidate-url.outputs.url }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          firebase_auth_project_id: ${{ vars.FIREBASE_AUTH_PROJECT_ID }}

      # This Cloud Run-only acceptance boundary runs before any traffic shift.
      - name: Accept no-traffic Cloud Run candidate
        id: verify-cloud-run-candidate
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/verify_backend_release_vector.py" \
            --candidate \
            --commit-sha "${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --short-sha "${{ steps.image-tag.outputs.short_sha }}" \
            --deploy-run-id "${{ github.run_id }}" \
            --deploy-run-attempt "${{ github.run_attempt }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --environment "${{ vars.ENV }}" \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --expected-image "${{ steps.push-runtime-image.outputs.immutable_ref }}" \
            --evidence-path artifacts/backend-cloud-run-candidate-release-vector.json

      - name: Mint backend candidate probe identity
        run: |
          set -euo pipefail
          token_file="$(mktemp "$RUNNER_TEMP/backend-candidate-probe.XXXXXX")"
          chmod 600 "$token_file"
          echo "BACKEND_CANDIDATE_PROBE_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          python3 "$DEPLOY_CONTROL_SCRIPTS/firebase_release_probe_token.py" \
            --secret-project "${{ vars.GCP_PROJECT_ID }}" \
            --firebase-project "${{ vars.FIREBASE_AUTH_PROJECT_ID }}" \
            --token-output "$token_file"

      - name: Prove canonical candidate chat compatibility
        run: |
          python3 "$DEPLOY_WORKFLOW_ROOT/.github/scripts/backend_candidate_probe.py" \
            --base-url="${{ steps.candidate-url.outputs.url }}" \
            --bearer-token-file="$BACKEND_CANDIDATE_PROBE_TOKEN_FILE" \
            --source-sha="${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --expected-contract-version="$CHAT_CONTRACT_VERSION" \
            --expected-revision="${{ steps.capture-backend-revision.outputs.revision }}" \
            --expected-image-digest="${{ steps.verify-image-lineage.outputs.runtime_digest }}" \
            --candidate-tag="$CANDIDATE_TAG" \
            --workflow-run-id="$GITHUB_RUN_ID" \
            --evidence-path=artifacts/backend-chat-candidate.json

      - name: Prove canonical candidate managed Gemini realtime path
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            probe_exit=0
            "$DEPLOY_WORKFLOW_ROOT/scripts/voice-provider-probe.sh" \
              "${{ steps.candidate-url.outputs.url }}" \
              --bearer-token-file="$BACKEND_CANDIDATE_PROBE_TOKEN_FILE" || probe_exit=$?
            if [[ "$probe_exit" -eq 0 ]]; then
              break
            fi
            if [[ "$probe_exit" -ne 75 || "$attempt" -eq 3 ]]; then
              echo "Managed Gemini realtime proof failed." >&2
              exit "$probe_exit"
            fi
            echo "Retrying Gemini realtime proof after a retryable upstream failure ($attempt/3)."
            sleep 5
          done

      - name: Delete backend candidate probe identity
        if: ${{ always() }}
        run: |
          if [[ -n "${BACKEND_CANDIDATE_PROBE_TOKEN_FILE:-}" ]]; then
            rm -f -- "$BACKEND_CANDIDATE_PROBE_TOKEN_FILE"
          fi

      - name: Remove passed transcription candidate tag
        if: ${{ success() }}
        run: |
          gcloud run services update-traffic "${{ env.CLOUD_RUN_SERVICE }}" \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --remove-tags="$CANDIDATE_TAG" \
            --quiet

      - name: Remove failed transcription candidate tag
        # Tag is created at deploy-backend; clean it up on any later failure,
        # not only after the candidate URL resolution step succeeds.
        if: ${{ failure() && steps.deploy-backend.outcome == 'success' }}
        run: |
          gcloud run services update-traffic "${{ env.CLOUD_RUN_SERVICE }}" \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --remove-tags="$CANDIDATE_TAG" \
            --quiet

      - name: Verify exact candidate composition
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/verify_backend_release_vector.py" \
            --candidate \
            --commit-sha "${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --short-sha "${{ steps.image-tag.outputs.short_sha }}" \
            --deploy-run-id "${{ github.run_id }}" \
            --deploy-run-attempt "${{ github.run_attempt }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --environment "${{ vars.ENV }}" \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --expected-image "${{ steps.push-runtime-image.outputs.immutable_ref }}" \
            --evidence-path artifacts/backend-deployment-composition.json

      - name: Capture Cloud Run pre-promotion traffic snapshot
        id: cloud-run-traffic-snapshot
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/cloud_run_traffic_snapshot.py" capture \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --output artifacts/backend-cloud-run-pre-promotion-traffic-snapshot.json

      - name: Verify validated revisions are still current
        run: |
          test "$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" --region=${{ env.REGION }} --format='value(status.latestCreatedRevisionName)')" = "${{ steps.capture-backend-revision.outputs.revision }}"

      - name: Shift Cloud Run traffic to validated revisions
        id: shift-cloud-run-traffic
        run: |
          gcloud run services update-traffic "${{ env.CLOUD_RUN_SERVICE }}" --project=${{ vars.GCP_PROJECT_ID }} --region=${{ env.REGION }} --to-revisions=${{ steps.capture-backend-revision.outputs.revision }}=100 --quiet

      # A traffic command can complete after an earlier target has moved. The
      # shared deploy lock prevents competing writers, while this read-only
      # gate prevents a partial apply from being reported as a healthy release.
      - name: Verify serving backend release vector
        id: verify-serving-release-vector
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/verify_backend_release_vector.py" \
            --commit-sha "${{ needs.firestore_readiness.outputs.admitted_sha }}" \
            --short-sha "${{ steps.image-tag.outputs.short_sha }}" \
            --deploy-run-id "${{ github.run_id }}" \
            --deploy-run-attempt "${{ github.run_attempt }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --environment "${{ vars.ENV }}" \
            --service "${{ env.CLOUD_RUN_SERVICE }}" \
            --expected-image "${{ steps.push-runtime-image.outputs.immutable_ref }}" \
            --evidence-path artifacts/backend-serving-release-vector.json

      - name: Smoke promoted production serving API
        id: smoke-promoted-production-serving-api
        if: ${{ github.event.inputs.environment == 'prod' }}
        env:
          PROBE_SECRET_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          FIREBASE_AUTH_PROJECT_ID: ${{ vars.FIREBASE_AUTH_PROJECT_ID }}
          SERVING_API_URL: ${{ steps.account-deletion-target.outputs.backend_url }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/firebase-production-serving-token"
          trap 'rm -f "$token_file"' EXIT
          python3 "$DEPLOY_CONTROL_SCRIPTS/firebase_release_probe_token.py" \
            --secret-project "$PROBE_SECRET_PROJECT" \
            --firebase-project "$FIREBASE_AUTH_PROJECT_ID" \
            --token-output "$token_file"
          python3 "$DEPLOY_CONTROL_SCRIPTS/transcription_capability_probe.py" \
            --candidate-api-url "$SERVING_API_URL" \
            --bearer-token-file "$token_file" --json-only

      - name: Restore Cloud Run traffic snapshot after failed promotion
        if: ${{ failure() && steps.cloud-run-traffic-snapshot.outcome == 'success' && (steps.shift-cloud-run-traffic.outcome == 'failure' || steps.verify-serving-release-vector.outcome == 'failure' || steps.smoke-promoted-production-serving-api.outcome == 'failure') }}
        run: |
          python3 "$DEPLOY_CONTROL_SCRIPTS/cloud_run_traffic_snapshot.py" restore \
            --snapshot artifacts/backend-cloud-run-pre-promotion-traffic-snapshot.json \
            --evidence-path artifacts/backend-cloud-run-traffic-restore.json

      - name: Smoke What Matters Now datastore query
        if: ${{ github.event.inputs.environment == 'development' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SERVING_API_URL: ${{ steps.account-deletion-target.outputs.backend_url }}
          ADMIN_KEY_VERSION: ${{ vars.ADMIN_KEY_VERSION }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_KEY_VERSION"
          [[ "$ADMIN_KEY_VERSION" != "latest" ]]
          ADMIN_KEY="$(gcloud secrets versions access "$ADMIN_KEY_VERSION" --secret=ADMIN_KEY --project="$PROJECT_ID")"
          export ADMIN_KEY
          trap 'unset ADMIN_KEY' EXIT
          python3 "$DEPLOY_CONTROL_SCRIPTS/smoke_what_matters_now.py" --base-url "$SERVING_API_URL"

      - name: Cloud Run deploy status report
        if: always()
        run: |
          set -o pipefail
          if [[ "${{ steps.verify-cloud-run-candidate.outcome }}" != "success" ]]; then
            echo "Cloud Run candidate verification failed before traffic promotion; candidate evidence follows."
            cat artifacts/backend-cloud-run-candidate-release-vector.json || true
            exit 0
          fi
          expected_traffic=()
          if [[ "${{ steps.shift-cloud-run-traffic.outcome }}" == "success" ]]; then
            expected_traffic=(
              --expect-cloud-run-traffic "${{ env.CLOUD_RUN_SERVICE }}"=${{ steps.capture-backend-revision.outputs.revision }}
            )
          fi
          python3 "$DEPLOY_CONTROL_SCRIPTS/deploy_status_report.py" \
            --env ${{ vars.ENV }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --include-cloud-run \
            --cloud-run-service "${{ env.CLOUD_RUN_SERVICE }}" \
            "${expected_traffic[@]}" \
            | tee /tmp/cloud-run-deploy-status.txt
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            {
              echo ""
              echo "### Cloud Run rollout status"
              echo ""
              echo '```text'
              cat /tmp/cloud-run-deploy-status.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backend release-vector evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/backend-cloud-run-candidate-release-vector.json
            artifacts/backend-image-lineage.json
            artifacts/backend-chat-candidate.json
            artifacts/backend-deployment-composition.json
            artifacts/backend-cloud-run-pre-promotion-traffic-snapshot.json
            artifacts/backend-serving-release-vector.json
            artifacts/backend-cloud-run-traffic-restore.json
          if-no-files-found: warn

      # If required, use the Cloud Run url output in later steps
      - name: Show Output
        run: echo ${{ steps.deploy-backend.outputs.url }}

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-summary
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.CLOUD_RUN_SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-notifier
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
