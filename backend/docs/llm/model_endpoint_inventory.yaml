schema_version: llm_model_endpoint_inventory.v2
route_authority: backend/utils/llm/model_config.py
routing_contract:
  mode: explicit_direct_workload
  unknown_key: fail_closed
  environment_selectable_profile: false
  customer_provider_selection: false
  application_gateway_callers: 0
  persistent_attempt_ledger: false

workloads:
  - key: chat_agent
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v2/models/gemini-3.7-flash:streamGenerateContent from local Node/Pi
    result_owner: owner-scoped Mac Node journal
  - key: chat_greeting
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v2/chat/initial-message
    result_owner: owner-scoped Mac Node journal
  - key: session_titles
    lifecycle: retained
    provider_model: gemini/gemini-2.5-flash-lite
    caller: POST /v2/chat/generate-title
    result_owner: owner-scoped Mac Chat catalog
  - key: conv_discard
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v1/conversation-compute/discard
    result_owner: Mac conversation transaction
  - key: conv_structure
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v1/conversation-compute/structure
    result_owner: Mac conversation transaction
  - key: conv_action_items
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v1/conversation-compute/action-items
    result_owner: Mac ActionItemStorage transaction
  - key: memory_l1
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v1/memory/compute/extract
    result_owner: Mac MemoryStorage lifecycle transaction
  - key: memory_l2
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v1/memory/compute/normalize
    result_owner: Mac MemoryStorage lifecycle transaction
  - key: memory_conflict
    lifecycle: retained
    provider_model: gemini/gemini-3.7-flash
    caller: POST /v1/memory/compute/consolidate
    result_owner: Mac MemoryStorage lifecycle transaction
  - key: translation
    lifecycle: retained
    provider_model: gemini/gemini-2.5-flash-lite
    caller: POST /v4/listen translation coordinator
    result_owner: matching Mac transcript segments
  - key: fair_use
    lifecycle: dependency_s20
    provider_model: gemini/gemini-3.7-flash
    caller: S-20 bounded fair-use classify route
    result_owner: S-20 Mac GRDB evidence and content-free enforcement facts
adjacent_direct_surfaces:
  - surface: desktop_gemini_generation
    provider_models:
      - gemini/gemini-2.5-flash
      - gemini/gemini-2.5-flash-lite
    owner: authenticated desktop proxy
    contract: non-stream generation only; Pro is rejected
  - surface: desktop_gemini_embeddings
    provider_model: gemini/gemini-embedding-001
    owner: authenticated desktop proxy
  - surface: omni_realtime_relay
    provider_models:
      - openai/realtime
      - gemini/live
    owner: native realtime voice policy; outside managed workload registry

retired_surfaces:
  - global premium/max/BYOK profiles
  - application gateway mode/auto lanes/shadow/circuit transport
  - Firestore llm_gateway_attempts ledger and cost cards
  - Perplexity/Sonar helper and credential templates
  - ElevenLabs /v2 TTS route
  - Gemini Pro and streaming desktop proxy routes
  - callerless onboarding and trends model helpers
  - OpenAI text and embedding helpers
  - stale file-chat model inventory

closure:
  status: complete
  permitted_s23_handoffs: []
  s25_handoff: complete; standalone routing topology removed
