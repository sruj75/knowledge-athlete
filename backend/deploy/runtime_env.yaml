schema_version: 1
environments:
  dev:
    gcp_project:
      env_var: GCP_PROJECT_ID
    runtime_gcp_project:
      env_var: RUNTIME_GCP_PROJECT_ID
    region: us-west1
    foundation:
      wif:
        provider: {env_var: GCP_WORKLOAD_IDENTITY_PROVIDER}
        deploy_service_account: {env_var: GCP_DEPLOY_SERVICE_ACCOUNT}
        firestore_readonly_service_account: {env_var: GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT}
        firestore_writer_service_account: {env_var: GCP_FIRESTORE_WRITER_SERVICE_ACCOUNT}
        claims:
          repository: {env_var: GITHUB_REPOSITORY}
          repository_id: {env_var: GITHUB_REPOSITORY_ID}
          repository_owner_id: {env_var: GITHUB_REPOSITORY_OWNER_ID}
          ref: refs/heads/main
          environment: development
          workflow_paths:
            deploy:
              - .github/workflows/gcp_backend.yml
              - .github/workflows/gcp_backend_auto_dev.yml
            firestore_readonly:
              - .github/workflows/gcp_backend.yml
              - .github/workflows/gcp_backend_auto_dev.yml
            firestore_writer:
              - .github/workflows/gcp_firestore_indexes.yml
      network:
        region: us-west1
        connectivity: public-egress
      redis:
        provider: upstash
        database: intentive-development
        region: us-west-2
        plan: free
        endpoint:
          host: {env_var: REDIS_DB_HOST}
          port: {env_var: REDIS_DB_PORT}
        auth: true
        transit_encryption: TLS
        verification: runtime-tls-probe
      firestore:
        project: {env_var: RUNTIME_GCP_PROJECT_ID}
        database: (default)
        index_reconciliation: create-only
        destructive_changes: false
      gcs:
        bucket: {env_var: BUCKET_DESKTOP_UPDATES}
        location: us-west1
        uniform_bucket_level_access: true
        public_access_prevention: enforced
        runtime_access: read-and-sign-only
        signing_method: iamcredentials.signBlob
        signing_service_account: {env_var: BACKEND_RUNTIME_SERVICE_ACCOUNT}
        publisher_access: future-s29-prefix-writer
        retained_prefixes: [updates/, previews/]
        lifecycle_rules: []
      tasks:
        queue:
          name: account-deletion
          location: us-west1
          max_concurrent_dispatches: 1
          max_attempts: 5
          dispatch_deadline_seconds: 1500
          oidc_signer: {env_var: ACCOUNT_DELETION_TASKS_INVOKER_SA}
          handler_audience: {env_var: ACCOUNT_DELETION_HANDLER_URL}
      artifact_registry:
        repository: {env_var: ARTIFACT_REGISTRY_REPOSITORY}
        location: us-west1
        format: DOCKER
        release_tag: full-commit-sha
        deploy_identity: sha256-digest
        build_cache_tag: buildcache
        cleanup:
          dry_run_required: true
          delete_only_untagged_older_than_days: 30
          preserve_exact_release_images: true
          delete_cloud_run_revisions: false
      logging:
        bucket: _Default
        retention_days: 30
        external_archive: false
      alerts:
        policies: []
        notification_channel: {env_var: ALERT_NOTIFICATION_CHANNEL}
      budget:
        billing_account: {env_var: GCP_BILLING_ACCOUNT_ID}
        amount: {env_var: GCP_MONTHLY_BUDGET_AMOUNT}
        currency: {env_var: GCP_MONTHLY_BUDGET_CURRENCY}
        recipients: {env_var: GCP_BUDGET_RECIPIENTS}
        thresholds: [0.5, 0.8, 1.0]
        alert_only: true
    cloud_run:
      canonical_service_url: {env_var: BACKEND_CANONICAL_URL}
      workflow_files:
        - .github/workflows/gcp_backend_auto_dev.yml
        - .github/workflows/gcp_backend.yml
      network:
        flags: {}
      services:
        backend:
          deployment_name:
            env_var: BACKEND_CLOUD_RUN_SERVICE
          service_account:
            env_var: BACKEND_RUNTIME_SERVICE_ACCOUNT
          forbidden_env:
            - SERVICE_ACCOUNT_JSON
            - GOOGLE_APPLICATION_CREDENTIALS
          flags:
            --cpu: '1'
            --memory: 2Gi
            --concurrency: '20'
            --timeout: 3600s
            --min-instances: '0'
            --max-instances: '1'
            --execution-environment: gen2
            --allow-unauthenticated: true
            --no-session-affinity: true
            --cpu-throttling: true
            --no-cpu-boost: true
            --startup-probe: httpGet.path=/v1/health,periodSeconds=10,timeoutSeconds=5,failureThreshold=24
            --liveness-probe: httpGet.path=/v1/health,periodSeconds=10,timeoutSeconds=5,failureThreshold=5
          env:
            ACCOUNT_DELETION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            ACCOUNT_DELETION_TASKS_PROJECT:
              env_var: GCP_PROJECT_ID
              category: reliability
            ACCOUNT_DELETION_TASKS_LOCATION:
              value: us-west1
              category: reliability
            ACCOUNT_DELETION_TASKS_QUEUE:
              value: account-deletion
              category: reliability
            ACCOUNT_DELETION_HANDLER_URL:
              env_var: ACCOUNT_DELETION_HANDLER_URL
              category: reliability
            ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE
              category: reliability
            ACCOUNT_DELETION_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_TASKS_INVOKER_SA
              category: reliability
            ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE
              category: compatibility
            ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA
              category: compatibility
            ACCOUNT_DELETION_TASKS_MAX_ATTEMPTS:
              value: '5'
              category: reliability
            HTTP_ACCOUNT_DELETION_WIPE_RUN_TIMEOUT:
              value: '1500'
              category: reliability
            BILLING_MODE:
              value: disabled
              category: rollout
            DESKTOP_UPDATE_POINTERS_MODE:
              value: primary
              category: rollout
            DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
              value: '0.01'
              category: rollout
            GOOGLE_CLOUD_PROJECT:
              env_var: RUNTIME_GCP_PROJECT_ID
            FIREBASE_PROJECT_ID:
              env_var: FIREBASE_AUTH_PROJECT_ID
            GCP_LOCATION:
              value: us-west1
            OMI_ENV_STAGE:
              value: dev
              category: runtime_identity
            BACKEND_RUNTIME_SERVICE_ACCOUNT:
              env_var: BACKEND_RUNTIME_SERVICE_ACCOUNT
              category: runtime_identity
            OMI_PARITY_PACK_CAPTURE:
              value: '1'
              category: replay_capture
            OMI_PARITY_PACK_ALLOWED_PRINCIPALS:
              value: vi7SA9ckQCe4ccobWNxlbdcNdC23
              category: replay_capture
            OMI_PARITY_PACK_ROOT:
              value: /tmp/omi-parity-pack
              category: replay_capture
            GOOGLE_CLIENT_ID:
              env_var: GOOGLE_CLIENT_ID
              category: oauth_metadata
            BASE_API_URL:
              env_var: BACKEND_CANONICAL_URL
              category: oauth_metadata
            POSTHOG_HOST:
              value: https://app.posthog.com
              category: telemetry
            LANGFUSE_BASE_URL:
              value: https://us.cloud.langfuse.com
              category: model_observability
            LANGFUSE_TRACING_ENVIRONMENT:
              value: development
              category: model_observability
            LANGFUSE_PROMPT_NAME:
              value: intentive-chat-system
              category: model_observability
            LANGFUSE_PROMPT_CACHE_TTL_SECONDS:
              value: '300'
              category: model_observability
            REDIS_DB_HOST:
              env_var: REDIS_DB_HOST
              category: private_dependency
            REDIS_DB_PORT:
              env_var: REDIS_DB_PORT
              category: private_dependency
            REDIS_DB_CA_CERT_PEM:
              env_var: REDIS_DB_CA_CERT_PEM
              category: private_dependency
            BUCKET_DESKTOP_UPDATES:
              env_var: BUCKET_DESKTOP_UPDATES
              category: desktop_artifacts
          secrets:
            GOOGLE_CLIENT_SECRET:
              secret: GOOGLE_CLIENT_SECRET
              version_env_var: GOOGLE_CLIENT_SECRET_VERSION
            MODULATE_API_KEY:
              secret: MODULATE_API_KEY
              version_env_var: MODULATE_API_KEY_VERSION
            LANGFUSE_PUBLIC_KEY:
              secret: LANGFUSE_PUBLIC_KEY
              version_env_var: LANGFUSE_PUBLIC_KEY_VERSION
            LANGFUSE_SECRET_KEY:
              secret: LANGFUSE_SECRET_KEY
              version_env_var: LANGFUSE_SECRET_KEY_VERSION
            GEMINI_API_KEY:
              secret: GEMINI_API_KEY
              version_env_var: GEMINI_API_KEY_VERSION
            OPENAI_API_KEY:
              secret: OPENAI_API_KEY
              version_env_var: OPENAI_API_KEY_VERSION
            FIREBASE_API_KEY:
              secret: FIREBASE_API_KEY
              version_env_var: FIREBASE_API_KEY_VERSION
            REDIS_DB_PASSWORD:
              secret: REDIS_DB_PASSWORD
              version_env_var: REDIS_DB_PASSWORD_VERSION
  prod:
    gcp_project:
      env_var: GCP_PROJECT_ID
    runtime_gcp_project:
      env_var: RUNTIME_GCP_PROJECT_ID
    region: us-west1
    foundation:
      wif:
        provider: {env_var: GCP_WORKLOAD_IDENTITY_PROVIDER}
        deploy_service_account: {env_var: GCP_DEPLOY_SERVICE_ACCOUNT}
        firestore_readonly_service_account: {env_var: GCP_FIRESTORE_READONLY_SERVICE_ACCOUNT}
        firestore_writer_service_account: {env_var: GCP_FIRESTORE_WRITER_SERVICE_ACCOUNT}
        claims:
          repository: {env_var: GITHUB_REPOSITORY}
          repository_id: {env_var: GITHUB_REPOSITORY_ID}
          repository_owner_id: {env_var: GITHUB_REPOSITORY_OWNER_ID}
          ref: refs/heads/main
          environment: prod
          workflow_paths:
            deploy:
              - .github/workflows/gcp_backend.yml
            firestore_readonly:
              - .github/workflows/gcp_backend.yml
            firestore_writer:
              - .github/workflows/gcp_firestore_indexes.yml
      network:
        region: us-west1
        vpc: {env_var: CLOUD_RUN_VPC_NETWORK}
        subnet: {env_var: CLOUD_RUN_VPC_SUBNET}
        private_service_access:
          range_name: {env_var: PRIVATE_SERVICE_ACCESS_RANGE_NAME}
          range_cidr: {env_var: PRIVATE_SERVICE_ACCESS_RANGE_CIDR}
      redis:
        instance_name: {env_var: REDIS_INSTANCE_NAME}
        region: us-west1
        tier: STANDARD_HA
        memory_gib: 1
        private_service_access: true
        auth: true
        transit_encryption: SERVER_AUTHENTICATION
      firestore:
        project: {env_var: RUNTIME_GCP_PROJECT_ID}
        database: (default)
        index_reconciliation: create-only
        destructive_changes: false
      gcs:
        bucket: {env_var: BUCKET_DESKTOP_UPDATES}
        location: us-west1
        uniform_bucket_level_access: true
        public_access_prevention: enforced
        runtime_access: read-and-sign-only
        signing_method: iamcredentials.signBlob
        signing_service_account: {env_var: BACKEND_RUNTIME_SERVICE_ACCOUNT}
        publisher_access: future-s29-prefix-writer
        retained_prefixes: [updates/, previews/]
        lifecycle_rules: []
      tasks:
        queue:
          name: account-deletion
          location: us-west1
          max_concurrent_dispatches: 1
          max_attempts: 5
          dispatch_deadline_seconds: 1500
          oidc_signer: {env_var: ACCOUNT_DELETION_TASKS_INVOKER_SA}
          handler_audience: {env_var: ACCOUNT_DELETION_HANDLER_URL}
      artifact_registry:
