schema_version: 1
environments:
  dev:
    gcp_project: based-hardware-dev
    runtime_gcp_project: based-hardware
    region: us-central1
    cloud_run:
      workflow_files:
        - .github/workflows/gcp_backend_auto_dev.yml
        - .github/workflows/gcp_backend.yml
      network:
        flags:
          --network: omi-dev-vpc-1
          --subnet: omi-us-central1-dev-vpc-1-subnet-1
          --vpc-egress: private-ranges-only
      services:
        backend:
          env:
            ACCOUNT_DELETION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            ACCOUNT_DELETION_TASKS_PROJECT:
              value: based-hardware-dev
              category: reliability
            ACCOUNT_DELETION_TASKS_LOCATION:
              value: us-central1
              category: reliability
            ACCOUNT_DELETION_TASKS_QUEUE:
              value: account-deletion
              category: reliability
            ACCOUNT_DELETION_HANDLER_URL:
              env_var: ACCOUNT_DELETION_HANDLER_URL
              category: reliability
            ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE
              category: reliability
            ACCOUNT_DELETION_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_TASKS_INVOKER_SA
              category: reliability
            ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE
              category: compatibility
            ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA
              category: compatibility
            ACCOUNT_DELETION_TASKS_MAX_ATTEMPTS:
              value: '5'
              category: reliability
            HTTP_ACCOUNT_DELETION_WIPE_RUN_TIMEOUT:
              value: '1500'
              category: reliability
            BILLING_MODE:
              value: disabled
              category: rollout
            DESKTOP_UPDATE_POINTERS_MODE:
              value: primary
              category: rollout
            DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
              value: '0.01'
              category: rollout
            GOOGLE_CLOUD_PROJECT:
              value: based-hardware
            GCP_LOCATION:
              value: us-central1
            USE_VERTEX_AI:
              value: 'true'
            OMI_ENV_STAGE:
              value: dev
              category: runtime_identity
            OMI_PARITY_PACK_CAPTURE:
              value: '1'
              category: replay_capture
            OMI_PARITY_PACK_ALLOWED_PRINCIPALS:
              value: vi7SA9ckQCe4ccobWNxlbdcNdC23
              category: replay_capture
            OMI_PARITY_PACK_ROOT:
              value: /tmp/omi-parity-pack
              category: replay_capture
            OMI_PARITY_PACK_GCS_URI:
              value: gs://based-hardware-dev-omi-parity-pack-v0/parity-pack/v0
              category: replay_capture
            OMI_PARITY_PACK_EXPORT_INTERVAL_SECONDS:
              value: '3600'
              category: replay_capture
            GOOGLE_CLIENT_ID:
              env_var: GOOGLE_CLIENT_ID
              category: oauth_metadata
            POSTHOG_HOST:
              value: https://app.posthog.com
              category: telemetry
          secrets:
            SERVICE_ACCOUNT_JSON:
              secret: SERVICE_ACCOUNT_JSON
              version: latest
            GOOGLE_CLIENT_SECRET:
              secret: GOOGLE_CLIENT_SECRET
              version: latest
            POSTHOG_PROJECT_API_KEY:
              secret: POSTHOG_PROJECT_API_KEY
              version: latest
            MODULATE_API_KEY:
              secret: MODULATE_API_KEY
              version: latest
  prod:
    gcp_project: based-hardware
    runtime_gcp_project: based-hardware
    region: us-central1
    cloud_run:
      workflow_files:
        - .github/workflows/gcp_backend.yml
      network:
        flags:
          --network:
            env_var: CLOUD_RUN_VPC_NETWORK
          --subnet:
            env_var: CLOUD_RUN_VPC_SUBNET
          --vpc-egress: private-ranges-only
      services:
        backend:
          env:
            ACCOUNT_DELETION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            ACCOUNT_DELETION_TASKS_PROJECT:
              value: based-hardware
              category: reliability
            ACCOUNT_DELETION_TASKS_LOCATION:
              value: us-central1
              category: reliability
            ACCOUNT_DELETION_TASKS_QUEUE:
              value: account-deletion
              category: reliability
            ACCOUNT_DELETION_HANDLER_URL:
              env_var: ACCOUNT_DELETION_HANDLER_URL
              category: reliability
            ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE
              category: reliability
            ACCOUNT_DELETION_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_TASKS_INVOKER_SA
              category: reliability
            ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE
              category: compatibility
            ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA
              category: compatibility
            ACCOUNT_DELETION_TASKS_MAX_ATTEMPTS:
              value: '5'
              category: reliability
            HTTP_ACCOUNT_DELETION_WIPE_RUN_TIMEOUT:
              value: '1500'
              category: reliability
            DESKTOP_UPDATE_POINTERS_MODE:
              value: primary
              category: rollout
            DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
              value: '0.01'
              category: rollout
            GOOGLE_CLOUD_PROJECT:
              value: based-hardware
            GCP_LOCATION:
              value: us-central1
            USE_VERTEX_AI:
              value: 'true'
            OMI_ENV_STAGE:
              value: prod
              category: runtime_identity
            GOOGLE_CLIENT_ID:
              env_var: GOOGLE_CLIENT_ID
              category: oauth_metadata
            BILLING_MODE:
              value: disabled
              category: rollout
            POSTHOG_HOST:
              value: https://app.posthog.com
              category: telemetry
          secrets:
            DESKTOP_PREVIEW_PUBLISH_KEY:
              secret: DESKTOP_PREVIEW_PUBLISH_KEY
              version: latest
            BETA_PROMOTION_TOKEN:
              secret: BETA_PROMOTION_TOKEN
              version: latest
            GOOGLE_CLIENT_SECRET:
              secret: GOOGLE_CLIENT_SECRET
              version: latest
            MODULATE_API_KEY:
              secret: MODULATE_API_KEY
              version: latest
