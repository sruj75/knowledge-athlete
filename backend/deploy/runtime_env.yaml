schema_version: 1
environments:
  dev:
    gcp_project: based-hardware-dev
    runtime_gcp_project: based-hardware
    region: us-central1
    llm_gateway:
      namespace: dev-omi-backend
      release_name: dev-omi-llm-gateway
      ingress_name: dev-omi-llm-gateway
      static_address_name: dev-llm-gateway-ilb-ip-address
    gke:
      backend-listen:
        values_file: backend/charts/backend-listen/dev_omi_backend_listen_values.yaml
        env:
          DESKTOP_UPDATE_POINTERS_MODE:
            value: primary
            category: rollout
          DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
            value: '0.01'
            category: rollout
          GOOGLE_CLOUD_PROJECT:
            value: based-hardware-dev
          GCP_LOCATION:
            value: us-central1
          USE_VERTEX_AI:
            value: 'true'
          OMI_LLM_GATEWAY_URL:
            value: http://dev-omi-llm-gateway.dev-omi-backend.svc.cluster.local:8080
            category: service_discovery
          OMI_ENV_STAGE:
            value: dev
            category: runtime_identity
          GOOGLE_CLIENT_ID:
            config_map:
              name: dev-omi-backend-config
              key: GOOGLE_CLIENT_ID
          REDIS_DB_HOST:
            config_map:
              name: dev-omi-backend-config
              key: REDIS_DB_HOST
          TYPESENSE_HOST:
            config_map:
              name: dev-omi-backend-config
              key: TYPESENSE_HOST
          MODULATE_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: MODULATE_API_KEY
          OMI_LLM_GATEWAY_FEATURE_MODE:
            value: gateway
            category: rollout
          OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION:
            value: 'false'
            category: rollout
          OMI_LLM_GATEWAY_CONVERSATION_STRUCTURE_SHADOW_ENABLED:
            value: 'false'
            category: rollout
          OMI_LLM_GATEWAY_CONVERSATION_STRUCTURE_SHADOW_SAMPLE_RATE:
            value: '1.0'
            category: rollout
          OMI_LLM_GATEWAY_CONVERSATION_ACTION_ITEMS_SHADOW_ENABLED:
            value: 'false'
            category: rollout
          OMI_LLM_GATEWAY_CONVERSATION_ACTION_ITEMS_SHADOW_SAMPLE_RATE:
            value: '1.0'
            category: rollout
          OMI_LLM_GATEWAY_DEV_SHADOW_ALL_ENABLED:
            value: 'false'
            category: rollout
          OMI_LLM_GATEWAY_DEV_SHADOW_ALL_SAMPLE_RATE:
            value: '1.0'
            category: rollout
          OMI_LLM_GATEWAY_SERVICE_TOKEN:
            secret:
              name: dev-omi-backend-secrets
              key: OMI_LLM_GATEWAY_SERVICE_TOKEN
          LISTEN_FINALIZATION_ORPHAN_STALE_SECONDS:
            value: '900'
            category: reliability
      # Direct pusher bindings are kept here as the dev source contract. The
      # deploy preflight compares this inventory to the rendered chart and
      # queries only live object/key metadata before a Helm upgrade.
      pusher:
        values_file: backend/charts/pusher/dev_omi_pusher_values.yaml
        env:
          GITHUB_TOKEN:
            secret:
              name: dev-omi-backend-secrets
              key: GITHUB_TOKEN
          OPENAI_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: OPENAI_API_KEY
          FAL_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: FAL_KEY
          PINECONE_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: PINECONE_API_KEY
          REDIS_DB_HOST:
            config_map:
              name: dev-omi-backend-config
              key: REDIS_DB_HOST
            clear_historical_secret: true
          REDIS_DB_PASSWORD:
            secret:
              name: dev-omi-backend-secrets
              key: REDIS_DB_PASSWORD
          ADMIN_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: ADMIN_KEY
          MODULATE_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: MODULATE_API_KEY
          GOOGLE_MAPS_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: GOOGLE_MAPS_API_KEY
          GOOGLE_CLIENT_ID:
            config_map:
              name: dev-omi-backend-config
              key: GOOGLE_CLIENT_ID
            clear_historical_secret: true
          GOOGLE_CLOUD_PROJECT:
            value: based-hardware-dev
            category: runtime
          GOOGLE_CLIENT_SECRET:
            secret:
              name: dev-omi-backend-secrets
              key: GOOGLE_CLIENT_SECRET
          ENCRYPTION_SECRET:
            secret:
              name: dev-omi-backend-secrets
              key: ENCRYPTION_SECRET
          DD_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: DD_API_KEY
          LANGCHAIN_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: LANGCHAIN_API_KEY
          TYPESENSE_HOST:
            config_map:
              name: dev-omi-backend-config
              key: TYPESENSE_HOST
            clear_historical_secret: true
          TYPESENSE_API_KEY:
            secret:
              name: dev-omi-backend-secrets
              key: TYPESENSE_API_KEY
          SERVICE_ACCOUNT_JSON:
            secret:
              name: dev-omi-backend-secrets
              key: SERVICE_ACCOUNT_JSON
          METRICS_SECRET:
            secret:
              name: dev-omi-backend-secrets
              key: METRICS_SECRET
    cloud_run:
      workflow_files:
        - .github/workflows/gcp_backend_auto_dev.yml
        - .github/workflows/gcp_backend.yml
      network:
        flags:
          --network: omi-dev-vpc-1
          --subnet: omi-us-central1-dev-vpc-1-subnet-1
          --vpc-egress: private-ranges-only
      services:
        backend:
          env:
            BILLING_MODE:
              value: disabled
              category: rollout
            DESKTOP_UPDATE_POINTERS_MODE:
              value: primary
              category: rollout
            DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
              value: '0.01'
              category: rollout
            GOOGLE_CLOUD_PROJECT:
              value: based-hardware
            GCP_LOCATION:
              value: us-central1
            USE_VERTEX_AI:
              value: 'true'
            OMI_ENV_STAGE:
              value: dev
              category: runtime_identity
            # Dev-only, exact-principal replay capture. Cloud Run's writable
            # scratch is ephemeral; persist synchronously to the private dev
            # bucket and never copy these values into the prod manifest.
            OMI_PARITY_PACK_CAPTURE:
              value: '1'
              category: replay_capture
            OMI_PARITY_PACK_ALLOWED_PRINCIPALS:
              value: vi7SA9ckQCe4ccobWNxlbdcNdC23
              category: replay_capture
            OMI_PARITY_PACK_ROOT:
              value: /tmp/omi-parity-pack
              category: replay_capture
            OMI_PARITY_PACK_GCS_URI:
              value: gs://based-hardware-dev-omi-parity-pack-v0/parity-pack/v0
              category: replay_capture
            OMI_PARITY_PACK_EXPORT_INTERVAL_SECONDS:
              value: '3600'
              category: replay_capture
            GOOGLE_CLIENT_ID:
              env_var: GOOGLE_CLIENT_ID
              category: oauth_metadata
            # Direct dev Cloud Run /v4/listen traffic remains public while the
            # retired Cloud Run Pusher route drains. It must use the GKE Pusher.
            HOSTED_PUSHER_API_URL:
              value: http://pusher.omiapi.com
              category: service_discovery
            OMI_LLM_GATEWAY_URL:
              env_var: OMI_LLM_GATEWAY_URL
              # The workflow replaces this with the ingress-derived address
              # after the gateway serving gate passes. Direct mode never uses
              # the sentinel, and it is deliberately not a routable contract.
              default: http://127.0.0.1:9
              category: service_discovery
            OMI_LLM_GATEWAY_FEATURE_MODE:
              value: gateway
              category: rollout
            OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_STRUCTURE_SHADOW_ENABLED:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_STRUCTURE_SHADOW_SAMPLE_RATE:
              value: '1.0'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_ACTION_ITEMS_SHADOW_ENABLED:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_ACTION_ITEMS_SHADOW_SAMPLE_RATE:
              value: '1.0'
              category: rollout
            OMI_LLM_GATEWAY_DEV_SHADOW_ALL_ENABLED:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_DEV_SHADOW_ALL_SAMPLE_RATE:
              value: '1.0'
              category: rollout
            POSTHOG_HOST:
              value: https://app.posthog.com
              category: telemetry
            LISTEN_FINALIZATION_ORPHAN_STALE_SECONDS:
              value: '900'
              category: reliability
          secrets:
            SERVICE_ACCOUNT_JSON:
              secret: SERVICE_ACCOUNT_JSON
              version: latest
            ENCRYPTION_SECRET:
              secret: ENCRYPTION_SECRET
              version: latest
            GOOGLE_CLIENT_SECRET:
              secret: GOOGLE_CLIENT_SECRET
              version: latest
            OMI_LLM_GATEWAY_SERVICE_TOKEN:
              secret: OMI_LLM_GATEWAY_SERVICE_TOKEN
              version: latest
            POSTHOG_PROJECT_API_KEY:
              secret: POSTHOG_PROJECT_API_KEY
              version: latest
            MODULATE_API_KEY:
              secret: MODULATE_API_KEY
              version: latest
        backend-sync: &dev_backend_sync
          env:
            GOOGLE_CLOUD_PROJECT:
              value: based-hardware
            GCP_LOCATION:
              value: us-central1
            USE_VERTEX_AI:
              value: 'true'
            OMI_ENV_STAGE:
              value: dev
              category: runtime_identity
            OMI_PARITY_PACK_CAPTURE:
              value: '1'
              category: replay_capture
            OMI_PARITY_PACK_ALLOWED_PRINCIPALS:
              value: vi7SA9ckQCe4ccobWNxlbdcNdC23
              category: replay_capture
            OMI_PARITY_PACK_ROOT:
              value: /tmp/omi-parity-pack
              category: replay_capture
            OMI_PARITY_PACK_GCS_URI:
              value: gs://based-hardware-dev-omi-parity-pack-v0/parity-pack/v0
              category: replay_capture
            OMI_PARITY_PACK_EXPORT_INTERVAL_SECONDS:
              value: '3600'
              category: replay_capture
            GOOGLE_CLIENT_ID:
              env_var: GOOGLE_CLIENT_ID
              category: oauth_metadata
            OMI_LLM_GATEWAY_URL:
              env_var: OMI_LLM_GATEWAY_URL
              default: http://127.0.0.1:9
              category: service_discovery
            OMI_LLM_GATEWAY_FEATURE_MODE:
              value: gateway
              category: rollout
            OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_STRUCTURE_SHADOW_ENABLED:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_STRUCTURE_SHADOW_SAMPLE_RATE:
              value: '1.0'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_ACTION_ITEMS_SHADOW_ENABLED:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_CONVERSATION_ACTION_ITEMS_SHADOW_SAMPLE_RATE:
              value: '1.0'
              category: rollout
            OMI_LLM_GATEWAY_DEV_SHADOW_ALL_ENABLED:
              value: 'false'
              category: rollout
            OMI_LLM_GATEWAY_DEV_SHADOW_ALL_SAMPLE_RATE:
              value: '1.0'
              category: rollout
            POSTHOG_HOST:
              value: https://app.posthog.com
              category: telemetry
            LISTEN_FINALIZATION_ORPHAN_STALE_SECONDS:
              value: '900'
              category: reliability
          forbidden_env:
            - HOSTED_PUSHER_API_URL
          secrets:
            SERVICE_ACCOUNT_JSON:
              secret: SERVICE_ACCOUNT_JSON
              version: latest
            ENCRYPTION_SECRET:
              secret: ENCRYPTION_SECRET
              version: latest
            GOOGLE_CLIENT_SECRET:
              secret: GOOGLE_CLIENT_SECRET
              version: latest
            OMI_LLM_GATEWAY_SERVICE_TOKEN:
              secret: OMI_LLM_GATEWAY_SERVICE_TOKEN
              version: latest
            POSTHOG_PROJECT_API_KEY:
              secret: POSTHOG_PROJECT_API_KEY
              version: latest
            MODULATE_API_KEY:
              secret: MODULATE_API_KEY
              version: latest
  prod:
    gcp_project: based-hardware
    runtime_gcp_project: based-hardware
    region: us-central1
    llm_gateway:
      namespace: prod-omi-backend
      release_name: prod-omi-llm-gateway
      ingress_name: prod-omi-llm-gateway
      static_address_name: prod-omi-self-hosted-llm-ip-address
    gke:
      backend-listen:
        values_file: backend/charts/backend-listen/prod_omi_backend_listen_values.yaml
        env:
          ACCOUNT_DELETION_DISPATCH_MODE:
            value: cloud_tasks
            category: reliability
          ACCOUNT_DELETION_TASKS_QUEUE:
            value: account-deletion
            category: reliability
          ACCOUNT_DELETION_HANDLER_URL:
            config_map:
              name: prod-omi-backend-config
              key: ACCOUNT_DELETION_HANDLER_URL
          SYNC_TASKS_PROJECT:
            value: based-hardware
            category: reliability
          SYNC_TASKS_LOCATION:
            value: us-central1
            category: reliability
          SYNC_TASKS_INVOKER_SA:
            config_map:
              name: prod-omi-backend-config
              key: SYNC_TASKS_INVOKER_SA
          SYNC_TASKS_HANDLER_URL:
            config_map:
              name: prod-omi-backend-config
              key: SYNC_TASKS_HANDLER_URL
          DESKTOP_UPDATE_POINTERS_MODE:
            value: primary
            category: rollout
          DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
            value: '0.01'
            category: rollout
          GOOGLE_CLOUD_PROJECT:
            value: based-hardware
          GCP_LOCATION:
            value: us-central1
          USE_VERTEX_AI:
            value: 'true'
          OMI_ENV_STAGE:
            value: prod
            category: runtime_identity
          GOOGLE_CLIENT_ID:
            config_map:
              name: prod-omi-backend-config
              key: GOOGLE_CLIENT_ID
          REDIS_DB_HOST:
            config_map:
              name: prod-omi-backend-config
              key: REDIS_DB_HOST
          TYPESENSE_HOST:
            config_map:
              name: prod-omi-backend-config
              key: TYPESENSE_HOST
          MODULATE_API_KEY:
            secret:
              name: prod-omi-backend-secrets
              key: MODULATE_API_KEY
          OMI_LLM_GATEWAY_URL:
            value: http://prod-omi-llm-gateway.prod-omi-backend.svc.cluster.local:8080
            category: service_discovery
          SERVICE_ACCOUNT_JSON:
            secret:
              name: prod-omi-backend-secrets
              key: SERVICE_ACCOUNT_JSON
          OMI_LLM_GATEWAY_FEATURE_MODE:
            value: gateway
            category: rollout
          OMI_LLM_GATEWAY_ALLOW_PROD_FEATURE_MODE:
            value: 'true'
            category: rollout
          OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION:
            value: 'false'
            category: rollout
          OMI_LLM_GATEWAY_SERVICE_TOKEN:
            secret:
              name: prod-omi-backend-secrets
              key: OMI_LLM_GATEWAY_SERVICE_TOKEN
          LISTEN_FINALIZATION_ORPHAN_STALE_SECONDS:
            value: '900'
            category: reliability
    cloud_run:
      workflow_files:
        - .github/workflows/gcp_backend.yml
      network:
        flags:
          --network:
            env_var: CLOUD_RUN_VPC_NETWORK
          --subnet:
            env_var: CLOUD_RUN_VPC_SUBNET
          --vpc-egress: private-ranges-only
      services:
        backend:
          env:
            LISTEN_FINALIZATION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            LISTEN_FINALIZATION_TASKS_QUEUE:
              value: conversation-finalization
              category: reliability
            LISTEN_FINALIZATION_TASKS_HANDLER_URL:
              env_var: LISTEN_FINALIZATION_TASKS_HANDLER_URL
              category: reliability
            LISTEN_FINALIZATION_TASKS_INVOKER_SA:
              env_var: LISTEN_FINALIZATION_TASKS_INVOKER_SA
              category: reliability
            LISTEN_FINALIZATION_TASKS_MAX_ATTEMPTS:
              value: '5'
              category: reliability
            HTTP_LISTEN_FINALIZATION_RUN_TIMEOUT:
              value: '1500'
              category: reliability
            ACCOUNT_DELETION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            ACCOUNT_DELETION_TASKS_QUEUE:
              value: account-deletion
              category: reliability
            ACCOUNT_DELETION_HANDLER_URL:
              env_var: ACCOUNT_DELETION_HANDLER_URL
              category: reliability
            SYNC_TASKS_PROJECT:
              value: based-hardware
              category: reliability
            SYNC_TASKS_LOCATION:
              value: us-central1
              category: reliability
            SYNC_TASKS_INVOKER_SA:
              env_var: SYNC_TASKS_INVOKER_SA
              category: reliability
            SYNC_TASKS_HANDLER_URL:
              env_var: SYNC_TASKS_HANDLER_URL
              category: reliability
            DESKTOP_UPDATE_POINTERS_MODE:
              value: primary
              category: rollout
            DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
              value: '0.01'
              category: rollout
            GOOGLE_CLOUD_PROJECT:
              value: based-hardware
            GCP_LOCATION:
              value: us-central1
            USE_VERTEX_AI:
              value: 'true'
            OMI_ENV_STAGE:
              value: prod
              category: runtime_identity
            GOOGLE_CLIENT_ID:
              env_var: GOOGLE_CLIENT_ID
              category: oauth_metadata
            BILLING_MODE:
              value: disabled
              category: rollout
            OMI_LLM_GATEWAY_URL:
              env_var: OMI_LLM_GATEWAY_URL
              # Never make a reserved ILB IP independently valid runtime
              # configuration. The deployment gate derives the live address.
              default: http://127.0.0.1:9
              category: service_discovery
            OMI_LLM_GATEWAY_FEATURE_MODE:
              value: gateway
              category: rollout
            OMI_LLM_GATEWAY_ALLOW_PROD_FEATURE_MODE:
              value: 'true'
              category: rollout
            OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION:
              value: 'false'
              category: rollout
            POSTHOG_HOST:
              value: https://app.posthog.com
              category: telemetry
            LISTEN_FINALIZATION_ORPHAN_STALE_SECONDS:
              value: '900'
              category: reliability
          secrets:
            DESKTOP_PREVIEW_PUBLISH_KEY:
              secret: DESKTOP_PREVIEW_PUBLISH_KEY
              version: latest
            BETA_PROMOTION_TOKEN:
              secret: BETA_PROMOTION_TOKEN
              version: latest
            ENCRYPTION_SECRET:
              secret: ENCRYPTION_SECRET
              version: latest
            GOOGLE_CLIENT_SECRET:
              secret: GOOGLE_CLIENT_SECRET
              version: latest
            MODULATE_API_KEY:
              secret: MODULATE_API_KEY
              version: latest
            OMI_LLM_GATEWAY_SERVICE_TOKEN:
              secret: OMI_LLM_GATEWAY_SERVICE_TOKEN
              version: latest
        backend-sync: &prod_backend_sync
          env:
            LISTEN_FINALIZATION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            LISTEN_FINALIZATION_TASKS_QUEUE:
              value: conversation-finalization
              category: reliability
            LISTEN_FINALIZATION_TASKS_HANDLER_URL:
              env_var: LISTEN_FINALIZATION_TASKS_HANDLER_URL
              category: reliability
            LISTEN_FINALIZATION_TASKS_INVOKER_SA:
              env_var: LISTEN_FINALIZATION_TASKS_INVOKER_SA
              category: reliability
            LISTEN_FINALIZATION_TASKS_MAX_ATTEMPTS:
              value: '5'
              category: reliability
            HTTP_LISTEN_FINALIZATION_RUN_TIMEOUT:
              value: '1500'
              category: reliability
            ACCOUNT_DELETION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            ACCOUNT_DELETION_TASKS_QUEUE:
              value: account-deletion
              category: reliability
            ACCOUNT_DELETION_HANDLER_URL:
              env_var: ACCOUNT_DELETION_HANDLER_URL
              category: reliability
            SYNC_TASKS_PROJECT:
              value: based-hardware
              category: reliability
            SYNC_TASKS_LOCATION:
              value: us-central1
              category: reliability
            SYNC_TASKS_INVOKER_SA:
              env_var: SYNC_TASKS_INVOKER_SA
              category: reliability
            SYNC_TASKS_HANDLER_URL:
              env_var: SYNC_TASKS_HANDLER_URL
              category: reliability
            GOOGLE_CLOUD_PROJECT:
              value: based-hardware
            GCP_LOCATION:
              value: us-central1
            USE_VERTEX_AI:
              value: 'true'
            OMI_ENV_STAGE:
              value: prod
              category: runtime_identity
            GOOGLE_CLIENT_ID:
              env_var: GOOGLE_CLIENT_ID
              category: oauth_metadata
            OMI_LLM_GATEWAY_URL:
              env_var: OMI_LLM_GATEWAY_URL
              default: http://127.0.0.1:9
              category: service_discovery
            OMI_LLM_GATEWAY_FEATURE_MODE:
              value: gateway
              category: rollout
            OMI_LLM_GATEWAY_ALLOW_PROD_FEATURE_MODE:
              value: 'true'
              category: rollout
            OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION:
              value: 'false'
              category: rollout
            POSTHOG_HOST:
              value: https://app.posthog.com
              category: telemetry
            LISTEN_FINALIZATION_ORPHAN_STALE_SECONDS:
              value: '900'
              category: reliability
          secrets:
            ENCRYPTION_SECRET:
              secret: ENCRYPTION_SECRET
              version: latest
            GOOGLE_CLIENT_SECRET:
              secret: GOOGLE_CLIENT_SECRET
              version: latest
            MODULATE_API_KEY:
              secret: MODULATE_API_KEY
              version: latest
            OMI_LLM_GATEWAY_SERVICE_TOKEN:
              secret: OMI_LLM_GATEWAY_SERVICE_TOKEN
              version: latest
