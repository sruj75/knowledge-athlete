        location: us-west1
        format: DOCKER
        release_tag: full-commit-sha
        deploy_identity: sha256-digest
        build_cache_tag: buildcache
        cleanup:
          dry_run_required: true
          delete_only_untagged_older_than_days: 30
          preserve_exact_release_images: true
          delete_cloud_run_revisions: false
      logging:
        bucket: _Default
        retention_days: 30
        external_archive: false
      alerts:
        policies: [health_unreachable, cloud_run_5xx]
        notification_channel: {env_var: ALERT_NOTIFICATION_CHANNEL}
      budget:
        billing_account: {env_var: GCP_BILLING_ACCOUNT_ID}
        amount: {env_var: GCP_MONTHLY_BUDGET_AMOUNT}
        currency: {env_var: GCP_MONTHLY_BUDGET_CURRENCY}
        recipients: {env_var: GCP_BUDGET_RECIPIENTS}
        thresholds: [0.5, 0.8, 1.0]
        alert_only: true
    cloud_run:
      canonical_service_url: {env_var: BACKEND_CANONICAL_URL}
      workflow_files:
        - .github/workflows/gcp_backend.yml
      network:
        flags:
          --network:
            env_var: CLOUD_RUN_VPC_NETWORK
          --subnet:
            env_var: CLOUD_RUN_VPC_SUBNET
          --vpc-egress: private-ranges-only
      services:
        backend:
          deployment_name:
            env_var: BACKEND_CLOUD_RUN_SERVICE
          service_account:
            env_var: BACKEND_RUNTIME_SERVICE_ACCOUNT
          forbidden_env:
            - SERVICE_ACCOUNT_JSON
            - GOOGLE_APPLICATION_CREDENTIALS
          flags:
            --cpu: '2'
            --memory: 4Gi
            --concurrency: '20'
            --timeout: 3600s
            --min-instances: '1'
            --max-instances: '10'
            --execution-environment: gen2
            --allow-unauthenticated: true
            --no-session-affinity: true
            --no-cpu-throttling: true
            --no-cpu-boost: true
            --startup-probe: httpGet.path=/v1/health,periodSeconds=10,timeoutSeconds=5,failureThreshold=24
            --liveness-probe: httpGet.path=/v1/health,periodSeconds=10,timeoutSeconds=5,failureThreshold=5
          env:
            ACCOUNT_DELETION_DISPATCH_MODE:
              value: cloud_tasks
              category: reliability
            ACCOUNT_DELETION_TASKS_PROJECT:
              env_var: GCP_PROJECT_ID
              category: reliability
            ACCOUNT_DELETION_TASKS_LOCATION:
              value: us-west1
              category: reliability
            ACCOUNT_DELETION_TASKS_QUEUE:
              value: account-deletion
              category: reliability
            ACCOUNT_DELETION_HANDLER_URL:
              env_var: ACCOUNT_DELETION_HANDLER_URL
              category: reliability
            ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_TASKS_OIDC_AUDIENCE
              category: reliability
            ACCOUNT_DELETION_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_TASKS_INVOKER_SA
              category: reliability
            ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_OIDC_AUDIENCE
              category: compatibility
            ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA:
              env_var: ACCOUNT_DELETION_LEGACY_TASKS_INVOKER_SA
              category: compatibility
            ACCOUNT_DELETION_TASKS_MAX_ATTEMPTS:
              value: '5'
              category: reliability
            HTTP_ACCOUNT_DELETION_WIPE_RUN_TIMEOUT:
              value: '1500'
              category: reliability
            DESKTOP_UPDATE_POINTERS_MODE:
              value: primary
              category: rollout
            DESKTOP_UPDATE_RECONCILE_SAMPLE_RATE:
