version: 2
name: onboarding-smoke
tier: manual
description: >
  Destructive named-bundle smoke for capture-safe reset, same-bundle restart, completion persistence,
  and two consecutive retained onboarding exits. It remains manual because it changes setup state and
  may exercise macOS permission UI.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Onboarding/OnboardingFlow.swift
  - desktop/macos/Desktop/Sources/Onboarding/OnboardingLifecyclePolicy.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
  - desktop/macos/Desktop/Sources/AppState/AppState+SystemActions.swift
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/AuthService.swift
  - desktop/macos/Desktop/Sources/Providers/ChatProvider+OnboardingJournal.swift
preconditions:
  - named_test_bundle_only
  - automation_bridge_ready
  - auth_ready

steps:
  - id: S1
    name: Seed retained normal data
    do: "In a disposable named bundle, note one normal Chat conversation and the current local conversation, memory, task, and Rewind counts. These are negative controls and must survive both resets."

  - id: S2
    name: Reset stops capture before replay
    do: "Run reset_onboarding and wait for the same named bundle to restart on the promise stage. Verify transcription and screen-analysis intents are off, neither capture owner is running, completion is false, and reset_onboarding remains listed only for this non-production bundle."
    expect:
      text_visible:
        - "Set up Omi →"
        - "Skip"

  - id: S3
    name: First run uses meeting-only listening
    do: "Walk every retained stage from onboarding-flow.yaml, including Back revision and permission-no-start checks. Choose 'Only during meetings', verify Home and the opener, then quit and relaunch the same bundle and verify completion persists."

  - id: S4
    name: Second reset preserves ordinary data
    do: "Run reset_onboarding again. Verify the setup-only journal and retained setup answers are cleared, while the normal Chat conversation and the recorded conversation, memory, task, and Rewind counts are unchanged."

  - id: S5
    name: Second run uses continuous listening
    do: "Walk every retained stage again and choose 'Start listening — continuously'. Verify Home, the opener, active continuous listening subject to existing access gates, then quit and relaunch the same bundle and verify completion persists."

  - id: S6
    name: Two-run absence and isolation gate
    do: "Across both reports verify no role, connector, Full Disk Access, BYOK, Goal, or Tasks stage appeared; permission grants never started capture before completion; and the second run did not inherit the first run's acquisition or resume answer."

  - id: S7
    name: Exercise the neutral Skip exit
    do: "Reset, advance to an intermediate stage, and choose the visible global Skip. Verify Home has no opener, both capture owners and intents are off, Launch at Login was not requested, and relaunch stays neutral. Explicitly enable one capability from Home and verify the old Skip fence no longer overrides that user choice."

  - id: S8
    name: Compare both user reset entrances
    do: "After separate genuine completions, run the confirmed Settings reset and the immediate status-menu reset. Each must stop capture before replay, preserve the S1 normal-data controls, clear only setup state, and return to the promise."

  - id: S9
    name: Prove owner isolation through sign-out
    do: "As account A, save a distinctive setup answer and resume step. Inject one failed Firebase sign-out and verify A remains usable without destructive capture/default/completion cleanup; then sign out successfully and authenticate as account B. Verify B sees no A answer, resume stage, setup transcript, fallback messages, opener, or running capture owner."

  - id: S10
    name: Verify last-window behavior before and after completion
    do: "During setup, close the last main window and verify the named-bundle PID exits and its automation bridge disconnects. Relaunch the same named bundle externally and verify the current stage resumes with capture off. After completion, close the last window and reopen it from the surviving status item; verify Home returns without replaying setup, duplicating the opener, or creating a second capture owner."
