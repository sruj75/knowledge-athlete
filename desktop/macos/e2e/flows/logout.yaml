version: 2
name: logout
tier: manual
description: Sign out from the real status-menu entry — local Auth emulator only, not prod OAuth (Live P2)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Auth/AuthOwnerTransition.swift
  - desktop/macos/Desktop/Sources/Auth/FirebaseAuthAvailability.swift
  - desktop/macos/Desktop/Sources/AuthService.swift
  - desktop/macos/Desktop/Sources/Chat/RuntimeOwnerIdentity.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/RewindDatabase+OwnerAuthorization.swift
  - desktop/macos/Desktop/Sources/Services/LocalMutationAuthorization.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/AssistantProtocol.swift
  - desktop/macos/Desktop/Sources/Auth/ExplicitSignOutAction.swift
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/SignInView.swift
preconditions:
  - auth_ready
  - local_auth_emulator

steps:
  - id: S1
    name: Baseline signed-in snapshot
    bridge.action:
      name: memories_snapshot
    expect:
      result.detail.is_signed_in: "true"

  - id: S2
    name: Sign out from the status menu
    do: "Open the Omi menu-bar item and click Sign Out. This must use AppDelegate.signOut and ExplicitSignOutAction, not the bridge sign_out shortcut."

  - id: S3
    name: Verify signed-out state
    bridge.action:
      name: memories_snapshot
    expect:
      result.detail.is_signed_in: "false"

  - id: S4
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
