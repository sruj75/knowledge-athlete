preconditions:
  - named_test_bundle_only
  - auth_ready
  - microphone_ready
  - authenticated_gemini_ready
  - managed_live_and_supervisor_prompts_ready
steps:
  - id: S0
    name: Voice-processing startup on the current physical route
    do: "Record the named bundle and physical input/output rates and channel counts. Open Talk once and confirm conversation_diagnostics_snapshot reaches an open Live route with microphoneAvailable true and increasing acceptedProcessedPCMBytes. Include a route where the voice-processing device exposes discrete multichannel capture; the same mono client format at the capture rate must reach both sides of voice processing, while provider playback remains 24 kHz. Confirm the microphone waveform responds to real speech, a spoken reply is admitted and a person hears the answer. PCM counts include silence and cannot establish signal preservation. A generic opening error or silent conversion fails this step. ConversationDuplexFormatTests exercises the production format/conversion seam with synthetic buffers; voice processing is unsupported in AVAudioEngine manual rendering, so those tests do not qualify physical format negotiation or hearing."
  - id: S1
    name: User and proactive multi-reply conversations
    do: "Use the exact uniquely named development bundle and record its source/backend fingerprints. Tap Talk once, hear A, and exchange at least three replies without another tap. Repeat after permitted B initiation using controlled non-sensitive context. Verify both starts reveal the same original notch and floating conversation surface, with blue opening glow and thinking feedback. The microphone wave must track real input levels while listening, including natural replies; playback feedback must track rendered output. Both starts use one logical conversation, the surface remains visible between replies and on focus loss, and B initiation creates no invented user message. Explicit hide/snooze must end an open conversation; rapid close/reopen must not let an old dismiss hide the replacement. Save only IDs, timestamps, counts and outcome evidence. A separate non-production debug_bar_state preview may inspect these visuals without capture, but synthetic meter levels do not pass physical acceptance; restore idle after preview."
  - id: S2
    name: Natural interruption on physical routes
    do: "While A speaks through speakers, interrupt by speaking normally. Confirm a person heard A, output stops promptly, the new utterance is admitted without waiting for prior journal acknowledgement, and A's own voice does not trigger itself. Repeat through headphones and one supported Bluetooth route. Correlate nonzero microphone capture, utterance ID, connection generation and interrupted delivery outcome. Take conversation_diagnostics_snapshot before and after each exchange: it returns bounded metadata, accepted processed PCM counts, prompt reference and the latest delivery/render/drain receipt. PCM includes silence; the drain flag means a sealed, empty playback queue. Completion evidence also requires outcome completed, and neither rendering nor drain proves human hearing; snapshots are not an ordered event log. Injected PCM or returned provider audio alone cannot pass this step."
  - id: S3
    name: End conditions and listening silence
    do: "Verify explicit shortcut closure; then A's end_conversation closes only after final playback. Interrupt an ending reply and verify newer user speech defeats the obsolete end. Check 60 seconds of silence while input is available closes the conversation, with generation, playback, reconnect and fallback processing excluded. B activity and system audio must not reset the timer."
  - id: S4
    name: Persistent fallback and shared typed history
    do: "Force bounded Live recovery to exhaust. Continue at least three exchanges through processed microphone, Silero, batch STT, direct A and controlled TTS. Interrupt playback and type a reply. Verify the same prompt receipt and canonical conversation remain, fallback stays selected, late callbacks are rejected, and no Pi execution occurs. A proactive opening with ambiguous delivery must never be replayed."
  - id: S5
    name: Silent guidance and transcript revisions
    do: "Deliver a permitted fresh B cue during output. Verify playback is uninterrupted, the cue waits for an idle boundary, clientContent uses turnComplete false, and no competing speech begins. A later user reply may incorporate the cue without exposing it as a user message. Verify partial transcript revisions replace prior versions for B, completed and interrupted playback remain distinct, and expired or changed-account/context cues are rejected. Provider failure of silent append is a blocker, not a pass from wire shape alone."
  - id: S6
    name: Independent inputs and isolation
    do: "Test microphone, system audio, screen and webcam controls independently. Deny camera, enable then disconnect it, disable it, lock/sleep and change account. Confirm invalid frames and pending guidance are cleared, old callbacks cannot repopulate them, and other permitted inputs continue. Confirm no webcam recording is produced. Keep an unchanged screen visible beyond the old idle threshold; B receives fresh permitted observations without multiplying archival/OCR writes."
  - id: S7
    name: Prompt and telemetry boundaries
    do: "Record the pinned prompt receipt once, then reconnect, use typed input and force fallback. Verify all routes retain its exact version and report actual returned model versions. With sharing off, inspect safe trace metadata only: no dialogue, guidance, copied profile/Memory, raw audio or images. With explicit disposable-session opt-in, verify bounded conversation/transcript text only; private B guidance must still be absent. Revoke sharing during pending work; reenabling must not export old queued text. Never alter coaching prompts as part of this implementation run."
  - id: S8
    name: Quota and eight-hour resource soak
    do: "Run an eight-hour observation/resource soak on the named development bundle after the physical/provider steps pass. Record memory, CPU, inference counts, exclusive tokens, image capture age, queue/provider/end-to-end latency, skipped evaluations and quota gaps. Poll supervisor_diagnostics_snapshot for session-scoped admission, evaluator starts/returns/failures, bounded timing aggregates, pending work, input age, shared budget and retry state. Its evaluator round trip includes backend/network time, returns do not prove successful decisions, and an occupied evaluation slot also includes preparation/delivery; use provider telemetry for provider-only latency and exclusive token accounting. Snapshots are read-only and contain no image, transcript, prompt or guidance content. Changed events and quiet checks share one budget with no backlog or concurrent inference. Force quota exhaustion and verify visible degraded status, no retries before permitted reset even across lock/unlock, and resumption afterward. Compare quiet, changed and bursty profiles with the fake-clock benchmark; simulated eight hours do not establish real resource stability. Offline fixtures and local diagnostic smoke tests are preparation only and need no paid inference."
