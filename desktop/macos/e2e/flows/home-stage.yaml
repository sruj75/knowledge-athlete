version: 2
name: home-stage
tier: 2
description: Redesigned Home stage transitions (hub/chat) via automation bridge
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Chat/ScreenContextTelemetry.swift
  - desktop/macos/Desktop/Sources/MainWindow/CaptureListeningControls.swift
  - desktop/macos/Desktop/Sources/MainWindow/CaptureListeningLogic.swift
  - desktop/macos/Desktop/Sources/FloatingControlBar/AboutUserCard.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Services/AIUserProfileService.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatMessagesView.swift
  - desktop/macos/Desktop/Sources/MainWindow/HomeStatusControls.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/DashboardPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeStagePresentation.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/HomeChatCatalog.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeSuggestionsStore.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeKnowsComposer.swift
  - desktop/macos/Desktop/Sources/Theme/OmiColors.swift
  - desktop/macos/Desktop/Sources/MainWindow/MainChatNavigationRequest.swift
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+Settings.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S0
    name: Reset main chat for flow isolation
    bridge.action:
      name: reset_main_chat
    expect:
      result.detail.reset: "true"

  - id: S1
    name: Navigate to Dashboard
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S2
    name: Open inline chat
    bridge.action:
      name: home_open_chat
    wait:
      state.homeMode: chat

  - id: S3
    name: Enable Multiple Chat Sessions
    bridge.action:
      name: home_set_multi_chat
      params:
        enabled: "true"
    expect:
      result.detail.enabled: "true"

  - id: S4
    name: Open compact Chat catalog
    bridge.action:
      name: home_open_chat_catalog
    expect:
      result.detail.opened: "true"
    wait:
      state.homeCatalogOpen: true

  - id: S5
    name: Exercise local catalog CRUD and return to the empty default chat
    bridge.action:
      name: home_catalog_round_trip
    expect:
      result.detail.round_trip: "true"

  - id: S6
    name: Close compact Chat catalog
    bridge.action:
      name: home_close_chat_catalog
    expect:
      result.detail.closed: "true"
    wait:
      state.homeCatalogOpen: false

  - id: S7
    name: Collapse to the empty-history resting hub
    bridge.action:
      name: home_close_panel
    wait:
      state.homeMode: hub

  - id: S8
    name: Home ask stub (no LLM wait)
    bridge.action:
      name: home_ask
      params:
        query: "[[MARKER:home-stage-stub]]"
    expect:
      result.detail.sent: "[[MARKER:home-stage-stub]]"
    wait:
      state.homeMode: chat

  - id: S9
    name: Collapse back to loaded-history chat
    bridge.action:
      name: home_close_panel
    wait:
      state.homeMode: chat

  - id: S10
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
