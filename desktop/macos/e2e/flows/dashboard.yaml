version: 2
name: dashboard
tier: 2
description: Dashboard load with local task and goal projections
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/DashboardPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/GoalsWidget.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeSuggestionsStore.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeKnowsComposer.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/TaskNavigationRequestStore.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/UserFacingErrorPresentation.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/HomeChatCatalog.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Dashboard
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S2
    name: Refresh retained local projections
    bridge.action:
      name: refresh_all_data

  - id: S3
    name: Read local goals projection
    bridge.action:
      name: goals_snapshot
    expect:
      ok: true

  - id: S4
    name: Read retained conversation projection
    bridge.action:
      name: conversation_list_snapshot
    expect:
      ok: true

  - id: S5
    name: Logs contain no retired dashboard calls
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
        - "/v1/daily-score"
        - "/v1/what-matters-now"
