version: 2
name: retained-pi-tool-bridge
tier: manual
description: Live P2 — retained scoped tool crosses managed Pi and OMI_BRIDGE_PIPE into Swift
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Providers/ChatToolExecutor.swift
  - desktop/macos/Desktop/Sources/Providers/ChatToolExecutor+LocalStatus.swift
  - desktop/macos/Desktop/Sources/Providers/ConversationSemanticRecall.swift
  - desktop/macos/Desktop/Sources/Providers/LocalConversationToolService.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/DailyRecapLocalAuthority.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/TranscriptionStorage+SemanticSearch.swift
  - desktop/macos/Desktop/Sources/ResourceMonitor.swift
  - desktop/macos/Desktop/Sources/Chat/AgentRuntimeProcess.swift
preconditions:
  - auth_ready
  - named_test_bundle_only
  - managed_pi_ready

steps:
  - id: S1
    name: Start the named managed-Pi chat
    do: "Launch a named Intentive bundle with its packaged Pi extension and OMI_BRIDGE_PIPE enabled. Open Home chat and confirm the runtime is using the managed Pi adapter."
    expect:
      interactive_count: { min: 2 }

  - id: S2
    name: Invoke a retained scoped tool
    do: "Ask the assistant to read retained local status using get_local_status. Verify the completed tool activity names get_local_status and returns its typed local-status payload."
    expect:
      interactive_count: { min: 2 }

  - id: S3
    name: Invoke retained owner-local PTT data tools
    do: "Ask the assistant to list recent conversations, search those summaries, and produce a daily recap. Verify each completed tool activity reads owner-local data and no /v1/tools/conversations request appears in the named-bundle or backend logs."
    expect:
      interactive_count: { min: 2 }

  - id: S4
    name: Verify the private bridge receipt
    do: "Inspect the named-bundle logs and verify the call crossed the packaged Pi extension through OMI_BRIDGE_PIPE into ChatToolExecutor, with no hosted MCP, Calendar creation, file scan, knowledge-graph write, or omi-tools-stdio fallback."
    expect:
      interactive_count: { min: 1 }
