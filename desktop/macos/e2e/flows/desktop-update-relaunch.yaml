version: 2
name: desktop-update-relaunch
tier: manual
description: Verify a signed desktop update is reported installed only after the target build relaunches
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/UpdateRelaunchWindowPolicy.swift
  - desktop/macos/Desktop/Sources/UpdaterViewModel.swift
  - desktop/macos/Desktop/Sources/Updates/UpdateInstallationAdmission.swift
  - desktop/macos/Desktop/Sources/DesktopUpdatePolicyManager.swift
  - desktop/macos/Desktop/Sources/Startup/AppInstaller.swift
preconditions:
  - isolated_release_test_host
  - s28_owned_beta_identity_configured
  - signed_older_owned_beta_installed
  - signed_qualified_owned_beta_update_available

steps:
  - id: S1
    name: Record the source build
    do: "After S-28 provides the owned non-production Beta identity, launch the older signed owned Beta on an isolated release test host and record its version and build from About. Confirm no pending update-install attempt exists before starting. Do not substitute an inherited Omi bundle identity."

  - id: S2
    name: Hold installation until retained work is idle
    do: "For each authoritative activity class on an isolated release host—ambient recording/finalization, voice capture/provider/playback/tool/token work, and Chat send/streaming—start that activity before the qualified beta finishes downloading. Verify the app does not relaunch while the activity is live, transition that owner to idle, then verify Sparkle invokes the installer and relaunches exactly once. Repeat from the signed older fixture for each class; never launch or modify a production bundle on a maintainer workstation."

  - id: S3
    name: Verify the relaunched target build
    do: "After relaunch, confirm About reports the exact target build and the app is usable. Verify telemetry contains one correlated Update Install Started event followed by one Update Installed event with verified_after_relaunch=true and the same attempt ID."

  - id: S4
    name: Verify mismatch is fail-closed
    do: "Repeat with an isolated test fixture whose pending target build intentionally differs from the relaunched build. Verify Update Install Verification Failed is emitted and Update Installed is not emitted for that attempt."
