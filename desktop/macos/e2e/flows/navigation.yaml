version: 2
name: navigation
tier: 2
description: Top navigation smoke through the non-production automation bridge
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopNavigation.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/InsightsHubNavigation.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/InsightPage.swift
  - desktop/macos/Desktop/Sources/Identity/DesktopLifecycleIdentityCopy.swift
  - desktop/macos/Desktop/Sources/Identity/DesktopShellIdentityCopy.swift
  - desktop/macos/Desktop/Sources/Theme/OmiFont.swift
preconditions:
  - auth_ready
  - automation_bridge_ready

steps:
  - id: S1
    name: Verify Home tab loads
    bridge.navigate:
      target: home
      activateApp: false
    wait:
      state.selectedTab: Home

  - id: S2
    name: Navigate to Memory
    bridge.navigate:
      target: memories
      activateApp: false
    wait:
      state.selectedTab: Memory

  - id: S3
    name: Navigate to Tasks
    bridge.navigate:
      target: tasks
      activateApp: false
    wait:
      state.selectedTab: Tasks

  - id: S4
    name: Navigate through the unified Insights hub
    bridge.navigate:
      target: insights
      activateApp: false
    wait:
      state.selectedTab: Insights

  - id: S5
    name: Open Settings via gear icon
    bridge.navigate:
      target: settings
      settingsSection: General
      activateApp: false
    wait:
      state.selectedSettingsSection: General

  - id: S6
    name: Return to Home from Settings
    bridge.navigate:
      target: home
      activateApp: false
    wait:
      state.selectedTab: Home

  - id: S7
    name: Open Rewind via View menu
    bridge.navigate:
      target: rewind
      activateApp: false
    wait:
      state.selectedTab: Rewind

  - id: S8
    name: Return to Home
    bridge.navigate:
      target: home
      activateApp: false
    wait:
      state.selectedTab: Home

  - id: S9
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
