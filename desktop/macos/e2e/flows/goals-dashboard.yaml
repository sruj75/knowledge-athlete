version: 2
name: goals-dashboard
tier: 2
description: Hermetic simple local goal creation and Dashboard projection
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/GoalsWidget.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/DashboardPage.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/GoalStorage.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Dashboard
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S2
    name: Baseline local goals
    bridge.action:
      name: goals_snapshot
    expect:
      ok: true

  - id: S3
    name: Create a simple local goal
    bridge.action:
      name: create_test_goal
      params:
        title: "[[MARKER:goals-dashboard]] harness goal"
        description: "Local lifecycle acceptance"
    expect:
      result.detail.created: "true"

  - id: S4
    name: Read the goal from local storage
    bridge.action:
      name: goals_snapshot
    expect:
      ok: true

  - id: S5
    name: Logs contain no goal transport failure
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
        - "/v1/goals"
