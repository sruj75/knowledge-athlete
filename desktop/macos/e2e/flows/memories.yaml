version: 2
name: memories
tier: manual
description: Memory menu — navigate retained Memories and Conversations destinations
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/MemoryHubDestination.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/OmiSearchField.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/MemoriesPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/MemoryProvenance.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+Memories.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Open the Memory destination menu
    do: "Click the Memory button in the top nav bar. Verify its menu exposes Memories and Conversations, with no Brain Map entry."
    expect:
      text_visible:
        - Memories
        - Conversations

  - id: S2
    name: Select and verify Memories
    do: "Choose Memories from the Memory menu. Verify the full-width page shows Search memories, lifecycle/category filters, the Add button, and no device-scope or public/private controls."
    expect:
      text_visible:
        - Memories
      interactive_count: { min: 3 }

  - id: S3
    name: Exercise retained memory search
    bridge.action:
      name: memories_search
      params:
        query: "retained-memory"
    expect:
      result.detail.search_active: "true"

  - id: S4
    name: Select Conversations
    do: "Open the Memory menu and choose Conversations. Verify the full-width Conversations page loads with search, filters, and locally navigable conversation rows."
    expect:
      text_visible:
        - Conversations

  - id: S5
    name: Return to Memories
    do: "Open the Memory menu and choose Memories. Verify the memory list and shared search controls are visible."
    expect:
      text_visible:
        - Memories

  - id: S6
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
