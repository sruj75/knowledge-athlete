version: 2
name: home
tier: manual
description: Home tab — conversational coaching, retained history, and Capture/Listening status
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/NewBadge.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopWindowLayoutPolicy.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Verify Home tab is active
    do: "Verify the app shows the Home tab. Top nav bar should have Home and Memory buttons. Home should be the active/selected tab."
    expect:
      interactive_count: { min: 6 }
      text_visible:
        - Home

  - id: S2
    name: Verify chat input area
    do: "Verify the chat input area is present on the Home tab. There should be a text field for typing messages and an Attachments button. Look for the send/stop button."
    expect:
      interactive_count: { min: 3 }

  - id: S3
    name: Verify Capture and Listening status
    do: "Verify the top-right area shows Capture status (may say 'Capture Blocked' if permission not granted) and Listening status (should show 'Listening On' state). Both should be clickable buttons."
    expect:
      interactive_count: { min: 2 }

  - id: S4
    name: Verify conversation history
    do: "Check that the Home page can display retained conversations and permission status banners. Verify the composer starts a coaching conversation."
    expect:
      interactive_count: { min: 1 }

  - id: S5
    name: Verify Settings gear accessible
    do: "Click the Settings gear icon (label 'gearshape') in the top-right area. Verify Settings page opens. Then click Back to return to Home."
    expect:
      text_visible:
        - Settings
