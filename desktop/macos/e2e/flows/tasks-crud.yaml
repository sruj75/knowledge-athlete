version: 2
name: tasks-crud
tier: 2
description: Hermetic local task create, complete, readback, and delete via production bridge paths
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/TasksPage.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/ActionItemStorage.swift
  - desktop/macos/Desktop/Sources/Stores/TasksStore.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Tasks
    bridge.navigate:
      target: tasks
      activateApp: false
    wait:
      state.selectedTabIndex: 4

  - id: S2
    name: Create a local task
    bridge.action:
      name: create_task
      params:
        description: "[[MARKER:tasks-crud]] harness task"
        priority: high
    expect:
      result.detail.local_id: "true"

  - id: S3
    name: Read the task from local storage
    bridge.action:
      name: dump_tasks
      params:
        marker: "[[MARKER:tasks-crud]]"
    expect:
      result.detail.count: { min: 1 }
      result.detail.marker_absent: "false"

  - id: S4
    name: Complete the local task
    bridge.action:
      name: toggle_task
      params:
        description: "[[MARKER:tasks-crud]] harness task"
    expect:
      result.detail.completed: "true"

  - id: S5
    name: Read completed history
    bridge.action:
      name: dump_tasks
      params:
        includeCompleted: "true"
        marker: "[[MARKER:tasks-crud]]"
    expect:
      result.detail.marker_absent: "false"

  - id: S6
    name: Delete the same local task
    bridge.action:
      name: delete_task
      params:
        description: "[[MARKER:tasks-crud]] harness task"
    expect:
      result.detail.deleted: "true"

  - id: S7
    name: Verify the task is absent
    bridge.action:
      name: dump_tasks
      params:
        includeCompleted: "true"
        marker: "[[MARKER:tasks-crud]]"
    expect:
      result.detail.marker_absent: "true"

  - id: S8
    name: Logs contain no task transport failure
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
        - "/v1/action-items"
