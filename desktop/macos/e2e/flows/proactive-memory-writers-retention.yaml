version: 2
name: proactive-memory-writers-retention
tier: manual
description: Existing records remain available after automatic screen-derived writers are retired
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/MemoryExtraction/MemoryAssistantTelemetry.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/Insight/InsightStorage.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/GeminiClient.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/ProactiveModels.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/ProactiveStorage.swift
preconditions:
  - auth_ready
  - named_bundle_with_disposable_profile
steps:
  - id: S1
    name: Read retained records
    do: "Use a disposable profile with existing Focus, Insight, task and Memory records. Open each retained screen, search the archive and exercise manual edits. Confirm the records survive disabling Supervisor and restarting the named bundle."
  - id: S2
    name: Confirm writer retirement
    do: "Show a controlled task or memory cue on screen with capture enabled. Verify Supervisor only evaluates and guides voice; no new screen-derived task, Memory, Focus or Insight record is created, and no old worker card or glow appears. Independently finalize a recorded conversation and verify its ordinary enrichment still works."
