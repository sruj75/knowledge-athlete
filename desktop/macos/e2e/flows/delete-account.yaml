version: 2
name: delete-account
tier: manual
description: Delete Account confirmation sheet only — never confirm deletion (Live P2; not qualification tier)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+Account.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/Settings/Sections/SettingsContentView+AccountBilling.swift
  - desktop/macos/Desktop/Sources/Theme/OmiButtonStyle.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/SettingsPage.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Navigate to Settings Account section
    do: "Click the top-bar Settings gear (identifier: gearshape), then open Account & Plan in the Settings sidebar. Verify account email and Sign Out button are visible."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Account

  - id: S2
    name: Open delete confirmation
    do: "Scroll to the 'Delete Account & Data' row and click the red Delete button. Verify the alert sheet appears with title 'Delete Account and Data?', Cancel, and Delete Permanently buttons."
    expect:
      interactive_count: { min: 2 }
      text_visible:
        - Delete Account and Data?

  - id: S3
    name: Cancel deletion
    do: "Click Cancel on the confirmation alert. Verify the alert dismisses and the account section remains visible with no deletion in progress."
    expect:
      interactive_count: { min: 5 }

  - id: S4
    name: Return to Home
    do: "Click Home in the retained top bar to return to the Home page."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Home
