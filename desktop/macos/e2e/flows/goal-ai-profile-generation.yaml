version: 2
name: goal-local-lifecycle
tier: manual
description: Simple local goal create, edit, complete, Chat context, and restart lifecycle
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/GoalsWidget.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/GoalRecord.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/GoalStorage.swift
  - desktop/macos/Desktop/Sources/Providers/ChatProvider.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Create a simple goal
    do: "Open Dashboard, find Goals, and create a goal with a title and optional description. Verify there is no AI generation, numeric target, progress score, unit, history, or celebration control."
    expect:
      interactive_count: { min: 1 }

  - id: S2
    name: Edit and expose active goal context
    do: "Edit the goal title and description, then open ordinary main Chat. Verify the active-goal context uses the edited local title and description without a task link or cloud identifier."
    expect:
      interactive_count: { min: 1 }

  - id: S3
    name: Complete and restart
    do: "Complete the goal, quit and reopen only the named non-production bundle, and verify the same local goal remains completed while it is absent from active-goal Chat context."
    expect:
      interactive_count: { min: 1 }
