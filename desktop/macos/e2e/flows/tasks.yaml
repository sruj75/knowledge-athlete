version: 2
name: tasks
tier: manual
description: Local-authoritative Tasks UI with one To Do/Done list and retained inline controls
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/TasksPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/TaskDetailViews.swift
  - desktop/macos/Desktop/Sources/Stores/TasksStore.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/TaskAssistant.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/TaskAssistant+DueDates.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/TaskAssistant+OwnerAuthorization.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/TaskAssistantSettings.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/TaskModels.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/AssistantCoordinator.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Services/EmbeddingService.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/UI/TaskTestRunnerWindow.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/ActionItemStorage.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/ActionItemModels.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/ObservationRecord.swift
  - desktop/macos/Desktop/Sources/TaskActionItem.swift
  - desktop/macos/Desktop/Sources/Theme/OmiTextEditor.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Services/TaskReminderService.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Navigate to the local Tasks list
    do: "Click Tasks in the top navigation. Verify one task page with Search tasks, a To Do/Done switch, and no Board or Suggested surface."
    expect:
      text_visible:
        - Tasks
        - Search tasks

  - id: S2
    name: Create and edit inline
    do: "Use + or Command-N to create a task inline. Save it, select it, press Return twice within 0.4 seconds, edit the title, and press Escape; verify Escape saves the trimmed edit and exits editing."
    expect:
      interactive_count: { min: 3 }

  - id: S3
    name: Exercise retained task metadata
    do: "Set the task to High priority, assign a date and time, remove the deadline, then assign it again with weekly recurrence. Open Details and verify only retained description, due date, priority, recurrence, source, source app/window, context, confidence, and evidence fields can appear."
    expect:
      interactive_count: { min: 3 }

  - id: S4
    name: Verify grouped sections and local order
    do: "Verify Today & Overdue, Upcoming, Later, and No Deadline group only the To Do rows. Drag within To Do and across due sections, then search; verify drag is unavailable while search is active and in Done."
    expect:
      text_visible:
        - Today & Overdue
        - No Deadline

  - id: S5
    name: Complete reopen and Undo
    do: "Complete the recurring task and verify it moves to Done while exactly one future row remains in To Do. Reopen the same completed row, delete it, verify the five-second Undo toast, and Undo; verify the same local row and metadata return."
    expect:
      interactive_count: { min: 2 }

  - id: S6
    name: Verify rejected controls stay absent
    do: "Inspect the full Tasks page and selected task. Verify there is no Board, bulk selection, indent/outdent, tags, semantic category, Re-score, Suggested tasks, Work on this, Execute, task chat, task agent, or workstream control."
    expect:
      interactive_count: { min: 1 }
