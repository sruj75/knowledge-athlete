version: 2
name: audio-recording
tier: manual
description: Audio capture flow — verify Mac microphone selection, local conversation admission, transcription state, and stop recording
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/LocalTranscriptionService.swift
  - desktop/macos/Desktop/Sources/TranscriptionService.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/AudioCaptureService.swift
  - desktop/macos/Desktop/Sources/AudioMixer.swift
  - desktop/macos/Desktop/Sources/AppState.swift
  - desktop/macos/Desktop/Sources/FloatingControlBar/FloatingBarUsageLimiter.swift
  - desktop/macos/Desktop/Sources/SystemAudioCaptureService.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/AudioLevelWaveformView.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Navigate to Home capture controls
    do: "Click Home in the retained top bar. Verify the Capture and Listening controls are visible in the same top bar."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Home

  - id: S2
    name: Verify Listening control
    do: "Check the top-bar Listening control and note whether ambient microphone capture is On or Off. Use that retained control for start/stop; do not look for the deleted Dashboard recording button."
    expect:
      interactive_count: { min: 1 }

  - id: S2B
    name: Verify Mac microphone source state
    do: "Verify the selected CoreAudio microphone is shown before recording and can be changed to another available Mac input, including an ordinary Bluetooth headset microphone when one is connected. Confirm no wearable-device pairing or connection control is shown."
    expect:
      interactive_count: { min: 1 }

  - id: S3
    name: Toggle Listening
    do: "Click the top-bar Listening control. If microphone permission is NOT granted, use the adjacent Fix Permissions warning shield. If permission IS granted, ambient capture should start or stop and the Listening label must report the resulting state."
    expect:
      interactive_count: { min: 1 }

  - id: S4
    name: Verify recording or permission state
    do: "After toggling Listening, verify its top-bar state changed truthfully. If permission recovery was required, verify the Permissions page shows the microphone grant/reset actions."
    expect:
      interactive_count: { min: 1 }

  - id: S5
    name: Check top-bar permission recovery
    do: "If any retained permission needs attention, verify the warning-shield button labeled 'Fix Permissions' (identifier: permission-recovery-button) is visible in the top bar. Click it and note which permissions are flagged on the recovery page."
    expect:
      interactive_count: { min: 3 }

  - id: S6
    name: Verify microphone recovery actions
    do: "On the permission recovery page, verify the microphone status and available actions (Grant Access, Reset & Restart, Open Terminal, Open System Settings). The top bar must remain visible so Home or Settings can be selected to leave the page."
    expect:
      interactive_count: { min: 3 }

  - id: S7
    name: Return to Home
    do: "Click Home in the top bar to return to the Home page. Verify the retained Listening control is still visible."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Home
