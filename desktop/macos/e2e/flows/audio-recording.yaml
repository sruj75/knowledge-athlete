version: 2
name: audio-recording
tier: manual
description: Audio capture flow — verify Mac microphone selection, local conversation admission, transcription state, and stop recording
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/LocalTranscriptionService.swift
  - desktop/macos/Desktop/Sources/TranscriptionService.swift
  - desktop/Desktop/Sources/MainWindow/Pages/ConversationsPage.swift
  - desktop/Desktop/Sources/AudioCaptureService.swift
  - desktop/Desktop/Sources/AudioMixer.swift
  - desktop/Desktop/Sources/AppState.swift
  - desktop/macos/Desktop/Sources/FloatingControlBar/FloatingBarUsageLimiter.swift
  - desktop/macos/Desktop/Sources/SystemAudioCaptureService.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/AudioLevelWaveformView.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Navigate to Dashboard
    do: "Click the Dashboard sidebar icon (identifier: sidebar_dashboard) to navigate to the Dashboard page. Verify the page loads with conversations list, Quick Note button, and Start Recording button."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Dashboard

  - id: S2
    name: Verify Start Recording button
    do: "Check that the 'Start Recording' button with microphone icon is visible on the Dashboard. Note its position and state. If the app is already recording, a 'Stop Recording' button should be visible instead."
    expect:
      interactive_count: { min: 1 }

  - id: S2B
    name: Verify Mac microphone source state
    do: "Verify the selected CoreAudio microphone is shown before recording and can be changed to another available Mac input, including an ordinary Bluetooth headset microphone when one is connected. Confirm no wearable-device pairing or connection control is shown."
    expect:
      interactive_count: { min: 1 }

  - id: S3
    name: Click Start Recording
    do: "Click the 'Start Recording' button. If microphone permission is NOT granted, the app should show a permission request dialog or navigate to permission settings. If permission IS granted, the app should begin audio capture and the button should change to show recording state (e.g., 'Stop Recording' or recording indicator)."
    expect:
      interactive_count: { min: 1 }

  - id: S4
    name: Verify recording or permission state
    do: "After clicking Start Recording, check the resulting state. If recording started: verify recording indicator is visible, note any waveform or timer display. If permission was requested: verify the permission dialog or settings page is shown with microphone grant options."
    expect:
      interactive_count: { min: 1 }

  - id: S5
    name: Check top-bar permission recovery
    do: "If any retained permission needs attention, verify the warning-shield button labeled 'Fix Permissions' (identifier: permission-recovery-button) is visible in the top bar. Click it and note which permissions are flagged on the recovery page."
    expect:
      interactive_count: { min: 3 }

  - id: S6
    name: Verify microphone recovery actions
    do: "On the permission recovery page, verify the microphone status and available actions (Grant Access, Reset & Restart, Open Terminal, Open System Settings). The top bar must remain visible so Home or Settings can be selected to leave the page."
    expect:
      interactive_count: { min: 3 }

  - id: S7
    name: Return to Dashboard
    do: "Click Home in the top bar to return to the Home page. Verify the Start Recording button is visible."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Home
