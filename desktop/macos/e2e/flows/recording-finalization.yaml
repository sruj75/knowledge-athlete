version: 2
name: recording-finalization
tier: 2
description: Hermetic stop finalizes exactly one conversation in local authority and opens its durable detail
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/AppState/AppState+Transcription.swift
  - desktop/macos/Desktop/Sources/MainWindow/Conversations/ConversationActionItemEnrichment.swift
  - desktop/macos/Desktop/Sources/MainWindow/Conversations/ConversationDiscardAdmission.swift
  - desktop/macos/Desktop/Sources/ConversationFinalizationService.swift
  - desktop/macos/Desktop/Sources/MainWindow/Conversations/ConversationStructureEnrichment.swift
  - desktop/macos/Desktop/Sources/MainWindow/Conversations/ConversationRepository.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/TranscriptionStorage+LocalAuthority.swift
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+ConversationCompute.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Capture list baseline
    bridge.action:
      name: conversation_list_snapshot
    expect:
      ok: true

  - id: S2
    name: Finalize one hermetic local capture
    bridge.action:
      name: capture_test_transcript
      params:
        phase: lifecycle
        text: "[[MARKER:recording-finalization]] local durable capture"
    expect:
      result.detail.stopped: "true"
      result.detail.conversation_count_increased: "true"
      result.detail.segment_count: "1"

  - id: S3
    name: Load the finalized row and detail from local authority
    bridge.action:
      name: conversation_local_authority_snapshot
    expect:
      result.detail.list_loaded: "true"
      result.detail.detail_id_matches: "true"
      result.detail.detail_transcript_included: "true"
      result.detail.local_id_matches: "true"
      result.detail.local_status: completed
      result.detail.opened_detail: "true"

  - id: S4
    name: Verify one readable transcript segment
    bridge.action:
      name: conversation_detail_snapshot
    expect:
      result.detail.detail_open: "true"
      result.detail.segment_count: "1"

  - id: S5
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
